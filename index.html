// ===== 循环 BGM（Web Audio 实时合成，无音频文件）=====
// 第五人格风：A 小调哥特华尔兹（i–iv–V–i），3/4 拍，八音盒音色 + 低沉弦乐垫 + 稀疏小调旋律
let _bgm = null;
function bgmOn() { try { return localStorage.getItem("yehang_bgm") === "on"; } catch (e) { return false; } }
function bgmStart() {
  if (_bgm) return;
  try {
    if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === "suspended") _actx.resume();
    const ctx = _actx;
    const master = ctx.createGain(); master.gain.value = 0.0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(.055, ctx.currentTime + 3); // 淡入
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600; lp.Q.value = .4;
    lp.connect(master);
    // 八音盒音色：基频 + 4 次泛音（轻微失谐），快速起音、长衰减，像庄园里上弦的音乐盒
    const bell = (f, t0, d, vol) => {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o2.type = "sine"; o2.frequency.value = f * 4; o2.detune.value = 6;
      const g2 = ctx.createGain(); g2.gain.value = .25;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + .008);
      g.gain.exponentialRampToValueAtTime(.0006, t0 + d);
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp);
      o.start(t0); o2.start(t0); o.stop(t0 + d + .03); o2.stop(t0 + d + .03);
    };
    // 低音弦乐垫：阴沉绵长，铺出庄园的氛围
    const pad = (f, t0, d, vol) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + .4);
      g.gain.exponentialRampToValueAtTime(.0008, t0 + d);
      o.connect(g); g.connect(lp); o.start(t0); o.stop(t0 + d + .05);
    };
    // A 小调：Am–Dm–E–Am，最后那个 E（属和弦的 G#）带来“哥特式”的紧张感
    const bass = [110.00, 146.83, 164.81, 110.00]; // A2 D3 E3 A2
    const chords = [
      [220.00, 261.63, 329.63], // Am
      [293.66, 349.23, 440.00], // Dm
      [329.63, 415.30, 493.88], // E
      [220.00, 261.63, 329.63]  // Am
    ];
    const mel = [440.00, 493.88, 523.25, 587.33, 659.25, 698.46, 830.61, 880.00]; // A 和声小调音阶
    const beat = .62, bar = 3; // 3/4 华尔兹，一小节约 1.86s
    let bi = 0, mi = 0, nextT = ctx.currentTime + .2;
    const timer = setInterval(() => {
      if (!_bgm) { clearInterval(timer); return; }
      while (nextT < ctx.currentTime + 1.0) {
        const ch = chords[bi % 4];
        pad(bass[bi % 4], nextT, beat * bar * 1.1, .5);                    // 低音垫铺满小节
        ch.forEach((f) => bell(f, nextT, beat * 1.7, .10));                // 强拍：八音盒和弦
        if (chance(.9)) bell(ch[1] * 2, nextT + beat, beat * 1.2, .07);    // 次强拍
        if (chance(.6)) bell(ch[2] * 2, nextT + beat * 2, beat * 1.2, .06);// 弱拍
        // 稀疏旋律：邻近音级漫步，时而休止，营造孤独悬疑感
        if (chance(.7)) { mi = clamp(mi + pick([0, 0, 1, -1, 2, -2, 3, -3]), 0, mel.length - 1); bell(mel[mi], nextT + beat * .5, beat * 2.2, .16); }

function phaseNameOf(s) {
  switch (s.step) {
    case "create": return "建号中";
    case "pre": case "offer": return "青训/选秀";
    case "season": case "match": case "po": return "职业选手";
    case "offseason": return "休赛期";
    case "stream": return "主播";
    case "coach": return "教练";
    case "end": return "已退役";
    default: return "生涯";
  }
}
function loadSlotInto(i) {
  setSlot(i);
  const d = readSlot(i);
  if (d && d.S && d.S.step && d.S.step !== "create") {
    S = d.S; migrateS(S); S.pop = null;
    const Lok = d.L && d.L.teams && d.L.teams.length && d.L.teams.every((t) => t && t.roster && t.sh && Array.isArray(t.bench));
    if (Lok) L = d.L;
    else {
      L = null;
      if (S.step === "match") { S.step = "season"; S.series = null; }
    }
    if (!L && (S.step === "season" || S.step === "match" || S.step === "po")) buildSeason();
  } else {
    S = newS(); L = null;
  }
  render();
}
function doSlotNew(i) {
  setSlot(i);
  try { localStorage.removeItem(slotKey(i)); } catch (e) { }
  S = newS(); L = null; S.pop = null;
  render();
}
function slotsModal() {
  const cur = curSlot();
  let rows = "";
  for (let i = 0; i < SLOT_COUNT; i++) {
    const d = readSlot(i);
    let label, meta, act;
    if (!d || !d.S || !d.S.step || d.S.step === "create") {
      label = "空档"; meta = "尚未开始生涯";
      act = `<button class="btn ghost sm" data-act="slotnew" data-arg="${i}">在此档开新局</button>`;
    } else {
      label = esc(d.S.name || "无名");
      meta = `${d.S.age || "?"}岁 · ${phaseNameOf(d.S)} · ${Math.round(d.S.money || 0)}万 · 粉${(d.S.fans || 0) >= 10000 ? ((d.S.fans || 0) / 10000).toFixed(1) + "万" : (d.S.fans || 0)}`;
      act = `<button class="btn primary sm" data-act="slotload" data-arg="${i}">载入</button><button class="btn ghost sm" data-act="slotnew" data-arg="${i}">覆盖新档</button>`;
    }
    rows += `<div class="slot-row${i === cur ? " on" : ""}"><div class="st">档 ${i + 1}${i === cur ? "（当前）" : ""}<b>${label}</b></div><div class="sd">${meta}</div><div class="row" style="gap:8px;margin-top:6px">${act}</div></div>`;
  }
  return `<div class="mask"><div class="modal" style="max-width:560px">
    <div class="eyebrow">SAVE SLOTS</div><h2>💾 存档管理</h2>
    <p class="note" style="text-align:center">三个独立档位，可同时体验职业 / 主播 / 教练路线。</p>
    ${rows}
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" data-act="closepop">关闭</button></div>
  </div></div>`;
}
function init() {
  loadSlotInto(curSlot());
  // 浏览器自动播放策略：首次点击/按键后，若此前打开过 BGM 开关则自动恢复
  const _bgmKick = () => { if (bgmOn()) bgmStart(); document.removeEventListener("pointerdown", _bgmKick); };
  document.addEventListener("pointerdown", _bgmKick);
}
init();
})();
</script>
