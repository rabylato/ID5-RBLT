<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1016">
<title>夜航 · 第五人格职业生涯模拟</title>
<style>
:root{
  --bg:#0e1016; --bg2:#151823; --card:#1b1f2c; --card2:#222738;
  --line:#2c3245; --ink:#e8e6df; --ink2:#b6b3a8; --ink3:#7c7e8d;
  --red:#b8332f; --red-hi:#e05542; --gold:#c9a85a; --gold-hi:#e6c97e;
  --green:#5a9e6f; --blue:#5b83b8; --purple:#8c6bb1; --muted:#7c7e8d;
  --shadow:0 10px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,textarea{-webkit-appearance:none;appearance:none}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 700px at 70% -10%,#1d2230 0%,var(--bg) 55%) fixed;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.7;overflow-wrap:break-word}
#app{max-width:1080px;margin:0 auto;padding:14px 16px 60px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
b{color:var(--ink)}
h1,h2,h3{font-weight:700;letter-spacing:.5px}
button{font-family:inherit;touch-action:manipulation}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#333a4f;border-radius:5px}

/* 通用组件 */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 em{font-style:normal;font-size:12px;color:var(--gold);border:1px solid var(--gold);
  border-radius:20px;padding:1px 10px;font-weight:400}
.card h3{font-size:14px;color:var(--ink2);font-weight:500;margin:4px 0 12px}
.note{color:var(--ink3);font-size:12.5px;line-height:1.8}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  padding:9px 18px;border-radius:10px;cursor:pointer;font-size:14px;transition:.15s;user-select:none}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--red-hi),var(--red));border-color:var(--red);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:8px}
.btn.gold{background:linear-gradient(180deg,#d8b96c,#b8923f);border-color:#b8923f;color:#1a1408;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);color:var(--ink2);
  border-radius:20px;padding:0 9px;margin-right:6px}
.tag.g{color:var(--green);border-color:var(--green)}
.tag.r{color:var(--red-hi);border-color:var(--red)}
.tag.y{color:var(--gold);border-color:var(--gold)}
.tag.b{color:var(--blue);border-color:var(--blue)}
.grid{display:grid;gap:12px}
.grid.g2{grid-template-columns:1fr 1fr}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid.ptgrid{grid-template-columns:1fr 1fr;margin-top:6px}
@media(max-width:760px){
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr 1fr}
  .grid.ptgrid{grid-template-columns:1fr}
  .attrs{grid-template-columns:1fr 1fr;gap:8px 16px}
  .acts{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
}
@media(max-width:480px){
  body{font-size:13.5px;-webkit-tap-highlight-color:transparent}
  #app{padding:10px 12px 50px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(50px,env(safe-area-inset-bottom));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  .kv{gap:6px 12px}
  .modal{padding:16px 16px;width:min(560px,94vw);max-height:92vh}
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:8px 16px}
  .hide-sm{display:none}
  .topbar{padding:8px 12px;gap:8px;top:6px;border-radius:12px}
  .topbar .logo{font-size:14px;letter-spacing:1px}
  .topbar .st{font-size:11.5px}
  .topbar .sp{gap:6px}
  .card{padding:14px 14px;border-radius:12px;margin-bottom:10px}
  .card h2{font-size:17px}
  .card h3{font-size:13px}
  .attrs{grid-template-columns:1fr 1fr;gap:8px 14px}
  .acts{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .act{padding:10px 12px}
  .act .t{font-size:13.5px}
  .act .d{font-size:11px}
  .btn{padding:10px 16px;font-size:13.5px;min-height:42px}
  .btn.sm{padding:6px 12px;min-height:40px}
  input.txt,textarea.txt{font-size:16px}
  .feed{max-height:320px}
  .score{font-size:22px}
  .create-hero h1{font-size:24px;letter-spacing:5px}
  .create-hero p{font-size:12px;letter-spacing:1px}
  .opt{padding:12px 14px;min-height:48px}
  .opt .t{font-size:14px}
  .opt .d{font-size:11.5px}
  .rt-x{min-height:36px;padding:6px 12px}
  .modal h2{font-size:18px}
  .modal .eyebrow{font-size:10px;letter-spacing:3px}
  .logbox{max-height:240px;font-size:12px}
  .toast{bottom:max(24px,env(safe-area-inset-bottom));font-size:13px;padding:10px 18px}
  .mask{padding:8px;align-items:flex-start}
  .modal{padding:16px 16px;width:min(560px,94vw);max-height:92vh}
  table{font-size:12px;display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  table thead,table tbody{display:table;width:100%}
  th,td{padding:6px 5px}
  .pav{width:22px;height:22px;margin-right:5px}
  .vsline{padding:6px 2px}
  /* 触摸优化 */
  .btn:active,.opt:active,.act:active,.tabs button:active{transform:scale(.97);filter:brightness(1.15)}
  .btn:hover{color:var(--ink)}
  .btn.primary:hover{filter:none;color:#fff}
  .btn.gold:hover{color:#1a1408}
}
/* 横屏窄高度优化 */
@media(max-height:500px) and (orientation:landscape){
  .modal{max-height:95vh}
  .feed{max-height:200px}
  .create-hero{padding:10px 10px 2px}
  .create-hero h1{font-size:22px}
  .topbar{padding:6px 10px;margin-bottom:8px}
}

/* 顶栏 */
.topbar{position:sticky;top:8px;z-index:30;background:rgba(20,23,33,.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;padding:10px 16px;display:flex;gap:14px;
  align-items:center;flex-wrap:wrap;margin-bottom:14px;box-shadow:var(--shadow)}
.topbar .logo{font-weight:800;letter-spacing:2px;color:var(--red-hi);font-size:16px;white-space:nowrap}
.topbar .st{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.topbar .st b{color:var(--ink)}
.topbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.rt-x{font-size:12px;color:var(--ink3);background:none;border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;cursor:pointer}
.rt-x:hover{color:var(--gold-hi);border-color:var(--gold)}
.bar{height:7px;background:#0c0e14;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red-hi));border-radius:4px}
.bar.gold i{background:linear-gradient(90deg,#9a7a35,var(--gold-hi))}
.bar.green i{background:linear-gradient(90deg,#3c7350,#6fc28a)}

/* 标签页 */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:10px;
  padding:7px 18px;cursor:pointer;font-size:13.5px}
.tabs button.on{background:var(--card2);color:var(--gold-hi);border-color:var(--gold)}

/* 属性 */
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin:10px 0}
.attr .lb{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.attr .vn b{color:var(--ink);font-size:13px}

/* 行动按钮 */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.act{text-align:left;padding:12px 14px;border-radius:12px;display:flex;flex-direction:column;gap:3px}
.act .t{font-weight:600;font-size:14px}
.act .d{font-size:11.5px;color:var(--ink3);line-height:1.55}

/* 事件流 */
.feed{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ev{border-left:3px solid var(--line);padding:6px 12px;background:rgba(255,255,255,.02);
  border-radius:0 8px 8px 0;font-size:13px}
.ev.good{border-color:var(--green)} .ev.bad{border-color:var(--red)}
.ev.big{border-color:var(--gold);background:rgba(201,168,90,.07)}
.ev .et{font-size:11px;color:var(--ink3);margin-right:8px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--ink3);font-weight:500;font-size:12px}
td.l,th.l{text-align:left}
.pav{display:inline-flex;vertical-align:middle;width:26px;height:26px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:#10131c;margin-right:7px;flex:none}
.pav svg{width:100%;height:100%}
tr.me td{background:rgba(184,51,47,.12);color:var(--gold-hi)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(5,6,10,.72);z-index:50;display:flex;
  align-items:center;justify-content:center;padding:20px}
.modal{width:min(560px,96vw);max-width:96vw;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#222738,#171a25);
  border:1px solid var(--gold);border-radius:16px;padding:24px 26px;box-shadow:0 20px 70px rgba(0,0,0,.7)}
.modal .eyebrow{text-align:center;color:var(--gold);letter-spacing:4px;font-size:11px}
.modal h2{text-align:center;font-size:22px;margin:6px 0 14px}
.logbox{background:#0d1018;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  font-size:12.5px;line-height:1.9;max-height:300px;overflow-y:auto;margin:10px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.logbox .w{color:var(--green);font-weight:600}
.logbox .l{color:var(--red-hi);font-weight:600}
.logbox .hl{color:var(--gold-hi)}

/* 新手指南 */
.guide{text-align:left;font-size:13px;line-height:1.7;color:var(--ink2)}
.guide section{margin:10px 0;padding:10px 12px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px}
.guide h3{margin:0 0 6px;font-size:13.5px;color:var(--gold-hi)}
.guide p{margin:3px 0}
.guide b{color:var(--ink)}
details.guide-toggle{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
details.guide-toggle summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--gold-hi)}
details.guide-toggle .guide{margin-top:10px}

/* 建号 */
.create-hero{text-align:center;padding:26px 10px 6px}
.create-hero h1{font-size:30px;letter-spacing:8px;color:var(--red-hi);text-shadow:0 0 30px rgba(224,85,66,.35)}
.create-hero p{color:var(--ink3);margin-top:8px;letter-spacing:2px}
.opt{text-align:left;padding:15px 17px;border-radius:12px;display:block;width:100%;cursor:pointer;
  background:var(--card2);border:1px solid var(--line);color:var(--ink);margin-bottom:0}
.opt:hover{border-color:var(--gold)}
.opt .t{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.opt .d{font-size:12px;color:var(--ink3);margin-top:5px;line-height:1.65}
.opt.sel{border-color:var(--gold);background:rgba(201,168,90,.08)}
input.txt,textarea.txt{width:100%;background:#0d1018;border:1px solid var(--line);border-radius:10px;
  color:var(--ink);padding:11px 14px;font-size:13px;font-family:inherit;resize:vertical}
input.txt:focus,textarea.txt:focus{outline:none;border-color:var(--gold)}

/* 对阵/比分 */
.score{font-size:26px;font-weight:800;letter-spacing:3px;text-align:center;margin:6px 0}
.vsline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px}
.vsline .tm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsline .tm:last-child{text-align:right}
.vsline .vs{color:var(--ink3);font-size:12px}
.brk{display:grid;gap:10px}
.brk .rr{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:80;
  background:#222738;border:1px solid var(--gold);color:var(--ink);border-radius:12px;
  padding:11px 22px;font-size:13.5px;box-shadow:var(--shadow);max-width:90vw;animation:tin .25s}
.toast.good{border-color:var(--green)} .toast.bad{border-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes login{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes charflash{0%{box-shadow:0 0 0 transparent;border-color:transparent}35%{box-shadow:0 0 16px var(--gold-hi);border-color:var(--gold-hi)}100%{box-shadow:0 0 0 transparent;border-color:inherit}}
.logline{opacity:0;animation:login .28s ease forwards}
.kv{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--ink2);margin:8px 0}
.kv b{color:var(--ink)}
.chip{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
/* 全量重绘的轻淡入 + 触摸优化 */
#app{animation:fadein .14s ease}
@keyframes fadein{from{opacity:.65}to{opacity:1}}
button,summary{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.slot-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.02)}
.slot-row.on{border-color:var(--gold);background:rgba(201,168,90,.07)}
.slot-row .st{font-size:13px;color:var(--ink2)}
.slot-row .st b{color:var(--gold-hi);margin-left:8px;font-size:14px}
.slot-row .sd{font-size:12px;color:var(--ink3);margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";
/* ============================================================
   常量 / 调参区 —— 全部数值与内容表集中在本节（至「工具」前），
   改字面量即可调游戏；CONFIG 为汇总视图，控制台 window.CONFIG
   可查看与临时修改（刷新失效）。引擎代码引用原 const，互不影响。
   ============================================================ */
const CONFIG = {};
const SAVE_VER = 11; // 存档结构版本：新增字段时在 MIGRATIONS 表追加一步，并同步 +1
const SAVE_KEY = "yehang_id5_save_v1";
// 多存档槽：档 0 复用旧键（老存档自动落入 0 号档），档 1/2 用独立键
const SLOT_COUNT = 3;
const SLOT_KEY = "yehang_id5_slot";
function slotKey(i) { return i === 0 ? SAVE_KEY : (SAVE_KEY + "_slot" + i); }
function curSlot() {
  let i = 0;
  try { i = parseInt(localStorage.getItem(SLOT_KEY), 10) || 0; } catch (e) { }
  if (i < 0 || i >= SLOT_COUNT) i = 0;
  return i;
}
function setSlot(i) { try { localStorage.setItem(SLOT_KEY, String(i)); } catch (e) { } }
function readSlot(i) {
  try { return JSON.parse(localStorage.getItem(slotKey(i)) || "null"); } catch (e) { return null; }
}
const DIMS_H = ["追击", "守椅", "控场", "意识", "心态"];
const DIMS_S = ["牵制", "救人", "破译", "配合", "心态"];
const ROLES = [
  { k: "rescue", n: "救人位", w: { 救人: 1.35, 牵制: 1.0, 配合: 1.05, 破译: .8, 心态: 1 },
    desc: "佣兵、前锋、大副——压满救、扛刀救，队友的第二条命。" },
  { k: "kite", n: "牵制位", w: { 牵制: 1.4, 救人: .9, 配合: 1.0, 破译: .85, 心态: 1 },
    desc: "先知、祭司、调香师——开局遛鬼 120 秒，电机就够了。" },
  { k: "decode", n: "修机位", w: { 破译: 1.45, 牵制: .8, 救人: .8, 配合: 1.0, 心态: 1 },
    desc: "机械师、囚徒、盲女——队伍的发动机，也是监管者的首抓目标。" },
  { k: "support", n: "辅助位", w: { 配合: 1.4, 救人: 1.0, 牵制: .95, 破译: .9, 心态: 1 },
    desc: "心理学家、昆虫学者、邮差——补状态、给信息、盘活全队。" }
];
// 角色名单（顺序=官方上线先后；CHAR_RELEASE 标注解锁赛季，0 = 2024夏之前已上线）
const CHARS_H = ["厂长", "小丑", "鹿头", "杰克", "蜘蛛", "红蝶", "黄衣之主", "宿伞之魂", "摄影师", "疯眼",
  "梦之女巫", "爱哭鬼", "孽蜥", "红夫人", "26号守卫", "使徒", "小提琴家", "雕刻家", "博士", "破轮",
  "渔女", "蜡像师", "噩梦", "记录员", "隐士", "守夜人", "歌剧演员", "愚人金", "时空之影", "跛脚羊",
  "喧嚣", "杂货商", "台球手", "女王蜂", "牙医", "心兽"];
const CHARS_S = ["幸运儿", "医生", "律师", "慈善家", "园丁", "魔术师", "冒险家", "佣兵", "空军", "机械师",
  "前锋", "盲女", "祭司", "调香师", "牛仔", "舞女", "先知", "入殓师", "勘探员", "咒术师",
  "野人", "杂技演员", "大副", "调酒师", "邮差", "守墓人", "囚徒", "昆虫学者", "画家", "击球手",
  "玩具商", "心理学家", "病患", "小说家", "小女孩", "哭泣小丑", "教授", "古董商", "作曲家", "记者",
  "飞行家", "拉拉队员", "木偶师", "火灾调查员", "法罗女士", "骑士", "气象学家", "弓箭手",
  "逃脱大师", "幻灯师", "斗牛士", "默剧艺人", "神童"];
// 角色解锁赛季（SEASON_LIST 的 idx；未列出 = 0，24夏前已上线）。按官方上线先后推定，可在 CONFIG 调整
const CHAR_RELEASE = {
  "时空之影": 0, "跛脚羊": 0, "喧嚣": 0,
  "杂货商": 2, "台球手": 3, "女王蜂": 4, "牙医": 4, "心兽": 5,
  "逃脱大师": 2, "幻灯师": 3, "斗牛士": 4, "默剧艺人": 4, "神童": 5
};
// 时间线：2024 夏季赛 ~ 2026 秋季赛，共 6 个赛季；玩家可任选赛季前出道

function playerVoice() {
  const pw = S.attrs ? powerAvg(S.attrs) : 50;
  const champ = (S.career && S.career.titles.length) || 0;
  const loyal = S.loyalty == null ? 50 : S.loyalty;

  const v = pw * 0.6 + champ * 15 + loyal * 0.3;
  return clamp(Math.round(v), 0, 100);
}
function powerAvg(attrs) {
  const vals = Object.values(attrs || {});
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 50;
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function charRoleOf(c) {
  if (charRoleOf._m && charRoleOf._m[c]) return charRoleOf._m[c];
  const m = CHAR_MODS[c] || {};
  const sc = { rescue: m["救人"] || 0, kite: m["牵制"] || 0, decode: m["破译"] || 0, support: m["配合"] || 0 };
  let best = "decode", bv = -1;
  Object.keys(sc).forEach((k) => { if (sc[k] > bv) { bv = sc[k]; best = k; } });
  (charRoleOf._m || (charRoleOf._m = {}))[c] = best;
  return best;
}
function charsOfRole(role, idx) { return availSChars(idx).filter((c) => charRoleOf(c) === role); }

function charModOf(c) {
  const m = Object.assign({}, CHAR_MODS[c] || {});
  const pm = (typeof S !== "undefined" && S && S.patchMods) ? S.patchMods[c] : null;
  if (pm) Object.keys(pm).forEach((d) => { m[d] = (m[d] || 0) + pm[d]; });
  return m;
}
function charModDesc(c) {

  const pm = (typeof S !== "undefined" && S && S.patchMods) ? S.patchMods[c] : null;
  let s = Object.keys(m).map((d) => `${d} ${m[d] > 0 ? "+" : ""}${m[d]}`).join("、") || "无特殊加成";
  if (pm) s += "（本季版本已调整）";
  return s;
}
// 实际落地一次版本更新：随机调整本赛季已上线角色的局内修正，并生成新闻
function applyPatch(big) {
  if (!S) return;
  if (!S.patchMods) S.patchMods = {};
  const idx = seasonIdx();
  const pool = availHChars(idx).map((c) => ({ c, dims: DIMS_H })).concat(availSChars(idx).map((c) => ({ c, dims: DIMS_S })));
  if (!pool.length) return;
  const n = big ? ri(3, 5) : ri(1, 2);
  const changes = [], seen = {};
  for (let i = 0; i < n; i++) {
    const t = pick(pool);
    const d = pick(t.dims);
    const key = t.c + "|" + d;
    if (seen[key]) continue;
    seen[key] = 1;
    const cur = (S.patchMods[t.c] && S.patchMods[t.c][d]) || 0;
    let delta = ri(1, 2) * (chance(.5) ? 1 : -1);
    if (Math.abs(cur + delta) > 4) delta = -delta; // 单项累计不超 ±4，防止滚雪球
    if (!S.patchMods[t.c]) S.patchMods[t.c] = {};
    S.patchMods[t.c][d] = cur + delta;
    changes.push(`${t.c} ${d}${delta > 0 ? "+" : ""}${delta}`);
  }
  if (!changes.length) return;
  pushNews(`版本更新：${changes.join("，")}。${big ? "新赛季平衡性大改，赛场格局或将洗牌。" : "本周热补丁已上线。"}`, "版本");
  pushEvent(`<b>版本更新</b>落地：${changes.join("，")}——局内属性修正已即时生效。`, "info", "版本");
}

/* ================= AI 选手生成 ================= */
let _uid = 0;
function genHandle(used) {
  for (let i = 0; i < 30; i++) {
    const n = pick(HANDLES) + (chance(.3) ? ri(0, 9) : "");
    if (!used[n]) { used[n] = 1; return n; }
  }
  return "路人" + (++_uid);
}
// 选手偏好角色（招牌）：PLAYER_FAV 覆盖优先，否则按选手 ID 稳定 hash 分配
// PLAYER_FAV 值可以是字符串（单一招牌）或数组（多角色池，取第一个）
function favCharOf(name, side, roleK, idx) {
  idx = idx == null ? seasonIdx() : idx;
  const rn = resolveId(name);
  let v = PLAYER_FAV[name] || PLAYER_FAV[rn];
  if (Array.isArray(v)) v = v[0];
  if (v) return v;
  const h = nameHash(name);
  if (side === "H") {
    const list = availHChars(idx);
    return list[h % list.length];
  }
  const list = charsOfRole(roleK, idx);
  return list.length ? list[h % list.length] : "幸运儿";
}
// AI 每图选角：偏好可用则用偏好，否则从同分工角色中稳定挑副选；遵守已用/禁用
function aiPickChar(p, usedSet, bannedSet, idx) {
  idx = idx == null ? seasonIdx() : idx;
  usedSet = usedSet || new Set(); bannedSet = bannedSet || new Set();
  const pool = p.role ? charsOfRole(p.role, idx) : availHChars(idx);
  let cand = pool.filter((c) => !usedSet.has(c) && !bannedSet.has(c));
  if (cand.indexOf(p.char) >= 0) return p.char;
  if (!cand.length) cand = (p.role ? availSChars(idx) : availHChars(idx)).filter((c) => !usedSet.has(c));
  cand.sort((a, b) => (nameHash(p.name + "|" + a) % 97) - (nameHash(p.name + "|" + b) % 97));
  return cand[0] || (p.role ? "幸运儿" : "厂长");
}
// 玩家对某角色的当前熟练度：偏好初始高，其余为基础值，使用后记录在 S.pool
function playerCharMastery(c) {
  const pool = S.pool || {};
  if (pool[c] != null) return pool[c];
  return c === S.fav ? (S.favM || 70) : 42;
}
function genAI(side, roleK, pw, used) {
  const dims = side === "H" ? DIMS_H : DIMS_S;
  const a = {}, mean = clamp(pw + ri(-7, 7), 25, 92);
  const w = side === "S" ? ROLES.find((r) => r.k === roleK).w : null;
  dims.forEach((d) => {
    let v = mean + ri(-11, 11);
    if (w) v *= w[d] || 1;
    a[d] = q1(clamp(v, 18, 97));
  });
  const nm = genHandle(used);
  return {
    name: nm, char: favCharOf(nm, side, roleK),
    role: side === "S" ? roleK : null, attrs: a, isP: false,
    mastery: q1(clamp(mean + ri(-8, 12) + (pw > 75 ? 6 : 0), 30, 98))
  };
}
// 真实名单选手：属性按战队战力 + ID hash 确定性生成（明星跨赛季稳定）
function makeRosterPlayer(name, side, roleK, pw) {
  const idx = seasonIdx();
  const dims = side === "H" ? DIMS_H : DIMS_S;
  const h = nameHash(name);
  const mean = clamp(pw - 4 + (h % 12) + ((h >> 4) % 3), 30, 95);
  const w = side === "S" ? ROLES.find((r) => r.k === roleK).w : null;
  const a = {};
  dims.forEach((d, i) => {
    let v = mean + (((h >> (i * 3)) % 17) - 8);
    if (w) v *= w[d] || 1;
    a[d] = q1(clamp(v, 20, 97));
  });
  return {
    name, char: favCharOf(name, side, roleK, idx),
    role: side === "S" ? roleK : null, attrs: a, isP: false, real: true,
    mastery: q1(clamp(mean + 3 + (h % 7), 40, 96))
  };
}
function playerAs(char) {
  char = char || S.fav;
  return { name: S.name, char, role: S.role, attrs: S.attrs, isP: true, mastery: playerCharMastery(char) };
}

/* ================= 1v4 半场模拟 =================
   4 名求生者 vs 1 监管者：破译→追击→上椅→救援→开门，tick=1s */
function simHalf(hunter, survs, strat, map, chem, tactics) {
  strat = strat || "normal";
  chem = chem || 0;
  tactics = tactics || {};
  const mT = MAP_TRAITS[map] || { decMul: 1, chase: 0, kite: 0 };
  const log = [];
  const keyIdx = []; // 关键回合在 log 中的下标
  // 角色局内修正：所有选手统一在此生效（CHAR_MODS + 版本补丁 S.patchMods），含玩家
  const effAttrs = (p) => {
    const a = Object.assign({}, p.attrs);
    const cm = charModOf(p.char);
    Object.keys(cm).forEach((d) => { a[d] = q1((a[d] || 0) + cm[d]); });
    return a;
  };
  let H = effAttrs(hunter);
  // 熟练度加成：角色熟练度越高，核心属性越强
  const hMast = hunter.mastery || 60;
  const hMastMul = 1 + (hMast - 60) / 300; // 60→1.0, 100→1.133
  if (hunter.isP) {
    if (strat === "aggro") { H["追击"] += 5; H["守椅"] += 4; H["控场"] -= 3; }
    else if (strat === "safe") { H["控场"] += 5; H["意识"] += 6; H["追击"] -= 3; }
    // 监管者战术指令：守椅策略 + 开门战 直接改 H 的有效属性
    if (tactics.rescue === "aggressive") { H["守椅"] += 5; H["控场"] -= 3; }
    else if (tactics.rescue === "control") { H["控场"] += 5; H["守椅"] -= 2; }
    else if (tactics.rescue === "field") { H["控场"] += 3; }
    if (tactics.gateWar === "gate") { H["控场"] += 8; }
    else if (tactics.gateWar === "chase") { H["追击"] += 5; }
  }
  const sAttr = survs.map(effAttrs);
  const sMast = survs.map((p) => p.mastery || 60);
  const st = survs.map(() => ({ s: "decode", chairN: 0, chairT: 0, downT: 0, downAt: -1, rescuer: -1, rescuedTry: false, arrive: 0 }));
  const perP = survs.map((p) => ({ name: p.name, isP: !!p.isP, kiteT: 0, rescOk: 0, rescTry: 0, dec: 0, exited: false }));
  const adj = (p) => {
    const a = { kite: 0, rescue: 0, decode: 0, coord: 0, mind: 0 };
    if (p.isP) {
      if (strat === "aggro") { a.kite += 5; a.rescue += 4; a.decode -= 3; }
      if (strat === "safe") { a.kite -= 3; a.coord += 5; a.mind += 6; }
      // 分工特训加成
      const tr = S.traits || {};
      a.kite += tr.kiteBonus || 0;
      a.rescue += tr.rescueBonus || 0;
      a.decode += tr.decodeBonus || 0;
      a.coord += tr.coordBonus || 0;
    }
    return a;
  };
  const K = (i) => sAttr[i]["牵制"] * (1 + (sMast[i] - 60) / 400) + adj(survs[i]).kite + mT.kite;
  const decMul = clamp((1.07 - H["控场"] / 205) * mT.decMul, .55, 1.15);
  let pool = 0; const NEED = 300;
  let machinesDone = false, gateT = 0;
  let chaseI = -1, firstDownT = -1;
  const ps = { kiteT: 0, kiteN: 0, rescOk: 0, rescTry: 0, dec: 0, exits: 0, exitsN: 0, kills: 0, games: 1 };
  // 战术指令摘要日志：让玩家直观看到本局下达的指令
  if (hunter.isP || survs.some((p) => p.isP)) {
    const tNames = hunter.isP
      ? { firstChase: { weak: "首追抓牵制位", decode: "首追抓破译位", rescue: "首追抓救援位" },
          rescue: { aggressive: "激进守椅", control: "控场守椅", field: "放椅控机" },
          gateWar: { gate: "守门死守", chairkill: "杀椅子保淘汰", chase: "追出门抓活的" } }
      : { firstChase: { hardkite: "交道具硬溜", rotate: "安全转点", tradepace: "快速倒地换节奏" },
          rescue: { half: "卡半救", full: "压满救", sell: "卖人保平" },
          gateWar: { rush: "全员冲门", finish: "压机后冲门", saveback: "回头救人" } };
    const ord = ["firstChase", "rescue", "gateWar"].map((k) => tactics[k] ? tNames[k][tactics[k]] : null).filter(Boolean).join(" · ");
    if (ord) log.push(`<span class="hl">战术指令：${ord}</span>`);
  }
  const pickTarget = () => {
    const cand = [];
    survs.forEach((p, i) => {
      if (st[i].s !== "decode") return;
      const weak = 88 - K(i);
      let roleBias = p.role === "decode" ? 16 : p.role === "support" ? 4 : 0;
      // 监管者首追目标战术：定向抓某位置
      if (hunter.isP) {
        const t = tactics.firstChase;
        if (t === "weak") roleBias = p.role === "kite" ? 16 : p.role === "decode" ? 12 : 4;
        else if (t === "decode") roleBias = p.role === "decode" ? 22 : 2;
        else if (t === "rescue") roleBias = p.role === "rescue" ? 22 : 2;
      }
      const aware = H["意识"] / 6;
      cand.push({ i, w: Math.max(2, weak + roleBias + aware + ri(-8, 8)) });
    });
    cand.sort((a, b) => b.w - a.w);
    return cand.length ? cand[0].i : -1;
  };
  const chairSomeone = (i, t) => {
    st[i].chairN++;
    if (st[i].chairN >= 3) { st[i].s = "dead"; ps.kills++; log.push(`<span class="l">${survs[i].name} 第三次倒地，被淘汰（飞天）。</span>`); return; }
    st[i].s = "chair"; st[i].chairT = 30; st[i].rescuer = -1; st[i].rescuedTry = false;
    log.push(`${survs[i].name} 第 ${st[i].chairN} 次被挂上狂欢之椅（${Math.round(t)}s）。`);
  };
  const beginChase = (i, t, second) => {
    chaseI = i; st[i].s = "chase";
    let dt = (second ? 22 : 36) + (K(i) - H["追击"] * hMastMul) * 1.35 + mT.chase + ri(-7, 7);
    // 首追战术指令（仅非二次追击时生效，影响首波牵制时长与破译进度）
    if (!second) {
      const fc = tactics.firstChase;
      if (fc === "hardkite") { dt += 12; }          // 硬溜：牵制+12s，消耗道具
      else if (fc === "rotate") { dt += 6; }         // 转点：稳健牵制+6s
      else if (fc === "tradepace") { dt -= 6; pool += 24; } // 换节奏：快速倒地换破译进度
    }
    dt = clamp(dt, second ? 5 : 8, second ? 52 : 92);
    st[i].downAt = t + dt;
    if (!second) { ps.kiteN++; }
  };
  for (let t = 0; t < 260; t++) {
    // 破译 / 开机
    survs.forEach((p, i) => {
      if (st[i].s === "decode") {
        let r = (.74 + sAttr[i]["破译"] / 128 + adj(p).decode / 100) * (1 + (sMast[i] - 60) / 500) * (1 + chem / 2000);
        if (machinesDone) r = 0;
        pool += r * decMul;
        perP[i].dec += r * decMul;
        if (p.isP) ps.dec += r * decMul;
      }
    });
    if (!machinesDone && pool >= NEED) {
      machinesDone = true; gateT = 20;
      log.push(`<span class="hl">四台密码机全部压好，进入开门战（${Math.round(t)}s）。</span>`);
    }
    if (machinesDone) {
      gateT--;
      if (gateT <= 0) {
        // 大门通电，结算逃生（开门战战术指令影响逃生倾向）
        const gw = tactics.gateWar;
        let gateBonus = 0;
        if (gw === "rush") { gateBonus = .15; log.push(`<span class="hl">战术指令：全员冲门（逃生率+15%），抢节奏出门！</span>`); }
        else if (gw === "finish") { gateBonus = .08; log.push(`<span class="hl">战术指令：压机完毕，全员冲门（逃生率+8%）！</span>`); }
        else if (gw === "saveback") {                    // 回头救人：派人救椅上的，逃生率整体下降
          const chairI = survs.findIndex((p, i) => st[i].s === "chair");
          if (chairI >= 0) {
            const resc = survs.findIndex((p, i) => i !== chairI && st[i].s === "decode");
            if (resc >= 0) {
              const rv = sAttr[resc]["救人"] + adj(survs[resc]).rescue;
              const rp = clamp(logi((rv - H["守椅"]) / 15 + .3) , .2, .85);
              log.push(`<span class="hl">战术指令：${survs[resc].name} 回头去救 ${survs[chairI].name}（判定 ${Math.round(rp * 100)}%）。</span>`);
              if (chance(rp)) {
                st[chairI].s = "decode";
                log.push(`<span class="w">${survs[chairI].name} 被救了下来，还有机会出门！</span>`);
              } else {
                log.push(`<span class="l">回头救援失败，${survs[resc].name} 也被留下。</span>`);
                st[resc].s = "dead"; ps.kills++;
              }
            }
          }
          gateBonus = -.12; // 救人拖慢了出门节奏
        }
        else if (gw === "chairkill") {
          // 监管者杀椅子：优先淘汰椅上/倒地的，保淘汰数，但开门防守减弱
          let killed = 0;
          survs.forEach((p, i) => {
            if (st[i].s === "chair" || st[i].s === "down") {
              st[i].s = "dead"; ps.kills++; killed++;
              log.push(`<span class="hl">战术指令：先杀椅上的——${p.name} 被淘汰。</span>`);
            }
          });
          if (killed === 0) log.push(`<span class="hl">战术指令：扫视全场，没有椅上人可杀。</span>`);
          gateBonus = .10; // 开门防守减弱，对方逃生率 +10%
        }
        survs.forEach((p, i) => {
          if (st[i].s === "gone" || st[i].s === "dead" || st[i].s === "chair") return;
          let pExit = .93 - H["控场"] / 260 + sAttr[i]["配合"] / 520 + adj(p).mind / 300 + chem / 1500 + gateBonus;
          if (st[i].s === "chase") pExit -= .32;
          pExit = clamp(pExit, .5, .98);
          if (chance(pExit)) {
            st[i].s = "gone"; ps.exits++; perP[i].exited = true;
            if (p.isP) { ps.exitsN = 1; log.push(`<span class="w">你从大门成功逃生。</span>`); }
          } else {
            st[i].s = "dead"; ps.kills++;
            log.push(`<span class="l">${p.name} 开门战被击倒，没能出门。</span>`);
          }
        });
        break;
      }
    }
    // 追击结算
    if (chaseI >= 0) {
      const i = chaseI;
      if (st[i].s === "chase") {
        perP[i].kiteT++;
        if (survs[i].isP) ps.kiteT++; // 玩家个人牵制时间（原误记为全队总和）
        if (t >= st[i].downAt) {
          if (firstDownT < 0) {
            firstDownT = t;
            const longKite = t >= 60;
            keyIdx.push(log.length);
            log.push(`开局首追 <b>${survs[i].name}</b>，牵制 <span class="hl">${Math.round(t)}</span> 秒后倒地。${longKite ? ' <span class="tag y">长牵制关键回合</span>' : ""}${survs[i].isP ? "（这波是你在遛鬼）" : ""}`);
          } else log.push(`${survs[i].name} 再次倒地（${Math.round(t)}s）。`);
          st[i].s = "down"; st[i].downT = 0; chaseI = -1;
        }
      }
    } else if (!machinesDone) {
      const ni = pickTarget();
      if (ni >= 0) beginChase(ni, t, st[ni].chairN > 0);
    }
    // 倒地→上椅
    survs.forEach((p, i) => {
      if (st[i].s === "down") {
        st[i].downT++;
        if (st[i].downT >= 2) chairSomeone(i, t);
      }
    });
    // 椅子与救援
    survs.forEach((p, i) => {
      if (st[i].s !== "chair") return;
      st[i].chairT--;
      if (st[i].rescuer < 0 && !st[i].rescuedTry) {
        let best = -1, bv = -1;
        survs.forEach((q, j) => {
          if (j === i || st[j].s === "gone" || st[j].s === "dead" || st[j].s === "chair" || st[j].s === "move") return;
          const v = sAttr[j]["救人"] + adj(q).rescue + (q.role === "rescue" ? 8 : 0);
          if (v > bv) { bv = v; best = j; }
        });
        if (best >= 0 && st[i].chairT <= 18) { st[i].rescuer = best; st[best].s = "move"; }
      }
      if (st[i].rescuer >= 0) {
        const j = st[i].rescuer;
        if (st[j].s === "move") {
          st[j].arrive = (st[j].arrive || 0) + 1;
          // 救援战术指令（在到达判定前计算，影响到达时机与成功率）
          let pBonus = 0, chairSkip = 0, sold = false;
          const rc = tactics.rescue;
          if (rc === "half") { pBonus = .18; }        // 卡半救：成功率+18%
          else if (rc === "full") { pBonus = .06; chairSkip = 3; } // 压满救：晚3秒到（队友多破译），成功率+6%
          else if (rc === "sell") { sold = true; }     // 卖：不救援，破译+
          if (st[j].arrive >= 6 + chairSkip) {
            st[j].arrive = 0;
            let rv = sAttr[j]["救人"] + adj(survs[j]).rescue + (survs[j].role === "rescue" ? 8 : 0);
            if (sold) {
              st[i].rescuedTry = true;
              st[j].s = "decode";
              perP[j].rescTry++;
              if (survs[j].isP) ps.rescTry++;
              pool += 24; log.push(`<span class="hl">战术指令：卖掉 ${survs[i].name}，全队转破译保平（破译 +24）。</span>`);
            } else {
              let hunterField = hunter.isP && tactics.rescue === "field" ? .1 : 0; // 监管者放椅控机：对方救援+10%
              const p = clamp(logi(((rv - H["守椅"]) / 15) + .35 + pBonus + hunterField) + chem / 1000, .12, .94);
              if (survs[j].isP) {
                log.push(`轮到你救援：救人判定 ${Math.round(p * 100)}%。`);
                if (chance(p)) { ps.rescOk++; perP[j].rescOk++; log.push(`<span class="w">你无伤（/扛刀）把人救了下来！</span>`); }
                else if (chance(.25)) { ps.kills++; keyIdx.push(log.length); log.push(`<span class="l">恐惧震慑！你倒在了椅子前。</span>`); chairSomeone(j, t); st[i].rescuedTry = true; }
                else { log.push(`<span class="l">救援被打退，你被迫撤开。</span>`); st[j].s = "decode"; st[i].rescuedTry = true; }
              } else {
                if (chance(p)) { perP[j].rescOk++; log.push(`${survs[j].name} 成功救下 ${survs[i].name}。`); }
                else if (chance(.22)) { ps.kills++; keyIdx.push(log.length); log.push(`<span class="l">${survs[j].name} 救援吃了震慑，双双倒地！</span>`); chairSomeone(j, t); st[i].rescuedTry = true; }
                else { log.push(`${survs[j].name} 救援失败，撤了回去。`); st[j].s = "decode"; st[i].rescuedTry = true; }
              }
              perP[j].rescTry++;
              if (survs[j].isP) ps.rescTry++; // 玩家个人救援尝试（原误记为全队总和）
              if (st[i].s === "chair" && st[i].rescuedTry === false) {
                // 救下成功
                if (survs[j].s !== "dead" && st[j].s !== "chair") st[j].s = "decode";
                st[i].s = "decode";
                beginChase(i, t, true);
              }
            }
          }
        }
      }
      if (st[i].chairT <= 0 && st[i].s === "chair") {
        st[i].s = "dead"; ps.kills++;
        log.push(`<span class="l">${survs[i].name} 椅子进度走完，被淘汰（${Math.round(t)}s）。</span>`);
      }
    });
    if (survs.every((p, i) => st[i].s === "gone" || st[i].s === "dead")) break;
  }
  // 兜底：时间耗尽
  survs.forEach((p, i) => {
    if (st[i].s !== "gone" && st[i].s !== "dead") {
      if (st[i].s === "chair" || st[i].s === "down") { st[i].s = "dead"; ps.kills++; }
      else { st[i].s = "gone"; ps.exits++; if (p.isP) ps.exitsN = 1; }
    }
  });
  if (hunter.isP) ps.kills = 4 - st.filter((x) => x.s === "gone").length;
  const exits = st.filter((x) => x.s === "gone").length;
  ps.kills = 4 - exits;
  ps.exits = exits;
  const line = exits === 4 ? "四出！求生者大胜" : exits === 3 ? "三出" : exits === 2 ? "保平（2出）" : exits === 1 ? "三抓" : "四抓！监管者大胜";
  if (exits === 4 || exits === 0) keyIdx.push(log.length);
  const resultLine = `<b style="font-size:13px">半场结果：${line}（逃生 ${exits} 人 / 淘汰 ${4 - exits} 人）。</b>`;
  log.push(resultLine);
  // 监管者逐人数据（用于 MVP）
  const hunterStat = { name: hunter.name, isP: !!hunter.isP, kills: 4 - exits, kiteT: firstDownT };
  return { exits, log, ps, perP, hunterStat, keyIdx, map };
}

function apNow() { return S.step === "pre" || S.step === "offer" ? S.pre.ap : S.ap; }

function coachTriggerEvent() {
  if (S.step !== "coach") return;
  if (S.pop) return;
  if (!S.coachEvHist) S.coachEvHist = [];
  const recent = S.coachEvHist.slice(-3);
  let pool = COACH_EVENTS.filter((e) => recent.indexOf(e.k) < 0);
  if (!pool.length) pool = COACH_EVENTS.slice();
  if (!pool.length) return;
  const ev = pick(pool);
  S.coachEvHist.push(ev.k);
  if (S.coachEvHist.length > 6) S.coachEvHist = S.coachEvHist.slice(-6);
  S.pop = { k: "coachevent", ev: ev };
  saveGame(); render();
}
function doCoachEventChoice(i) {
  const ev = S.pop && S.pop.ev;
  if (!ev) return;
  S.pop = null; // 先关弹窗再结算
  ev.opts[i].f();
  saveGame(); render();
}

function triggerEvent() {
  if (S.step !== "season" && S.step !== "stream") return;
  if (S.pop) return; // 已有弹窗
  if (!S.evHist) S.evHist = [];
  const recent = S.evHist.slice(-3); // 最近 3 个事件不重复
  const base = S.step === "stream" ? RANDOM_EVENTS.concat(STREAM_EVENTS) : RANDOM_EVENTS;
  let pool = base.filter((e) => (!e.w || e.w()) && recent.indexOf(e.k) < 0);
  if (!pool.length) pool = base.filter((e) => !e.w || e.w()); // 池空回退
  if (!pool.length) return;
  const ev = pick(pool);
  S.evHist.push(ev.k);
  if (S.evHist.length > 8) S.evHist = S.evHist.slice(-8);
  S.pop = { k: "event", ev: ev };
  saveGame(); render();
}
function doEventChoice(i) {
  const ev = S.pop && S.pop.ev;
  if (!ev) return;
  S.pop = null; // 先关弹窗再结算，允许选项内部触发后续事件
  ev.opts[i].f();
  saveGame(); render();
}

function startTryout(idx) {

  if (!o || o.used) return;
  S.pre.offerPick = idx;
  S.pre.tryout = { club: o.club, pw: o.pw, expect: o.expect, day: 0, score: 0, tasks: [], done: false };
  S.pop = { k: "tryout" };

function tryoutDay() {
  const t = S.pre.tryout;
  if (!t || t.done) return;
  t.day++;
  const taskNames = S.faction === "H"
    ? ["首追节奏试训", "守椅与救援博弈", "控图与多线程", "对内训练赛 BO1"]
    : ["开局牵制试训", "救援稳定性", "破译与大局观", "对内训练赛 BO1"];
  const mine = powerAvg(withInj(S.attrs)) + ri(-6, 8) + (S.fatigue > 70 ? -5 : 0);
  const std = t.pw - ri(4, 12);
  const ok = mine >= std - 4;
  t.score += mine - std;
  t.tasks.push({ name: taskNames[t.day - 1], mine: Math.round(mine), std: Math.round(std), ok });
  if (t.day >= 4) {
    t.done = true;
    const finalScore = Math.round(powerAvg(withInj(S.attrs)) + t.score / 4);
    t.finalScore = finalScore;
    t.tier = finalScore >= t.expect + 4 ? "start" : finalScore >= t.expect - 12 ? "sub" : "fail";
  }
  saveGame(); render();
}

  const t = S.pre.tryout, o = S.pre.offers[S.pre.offerPick];

  if (t.tier === "fail") {
    S.pre.tryout = null; S.pop = null;
    pushEvent(`<b>${o.club}</b> 试训没通过——评级差了一点。`, "bad", "试训");

  S.pre.tryout = null;
  S.pop = { k: "deal" };
  saveGame(); render();
}

var L = null; // 当前赛季联赛数据
function curLeague() { return S.league === "IJL" ? "IJL" : "IVL"; }
// 某赛区某赛季的参赛行：{sh, n(当季全名), pw, ids(报名名单), region}
function leagueRowsAt(league, idx) {
  if (league === "IJL") {
    const out = [];
    for (const sh in IJL_TEAMS) {
      const t = IJL_TEAMS[sh];
      if ((sh === "DFM" || sh === "QTD") && idx < 2) continue; // 25 夏才加入
      if (sh === "FAV" && idx >= 2) continue;                  // 席位被 DFM 承接
      const ks = Object.keys(t.seasons).map(Number).filter((k) => k <= idx).sort((a, b) => a - b);
      if (!ks.length) continue;
      const rec = t.seasons[ks[ks.length - 1]];
      out.push({ sh, n: rec[1], pw: t.pw, ids: rec[0].split(" "), region: "IJL" });
    }
    return out.sort((a, b) => b.pw - a.pw);
  }
  return IVL_SEASONS[Math.min(idx, IVL_SEASONS.length - 1)]
    .map((r) => ({ sh: r[0], n: r[1], pw: r[2], ids: r[3].split(" "), region: "IVL" }));
}
function curRows() { return leagueRowsAt(curLeague(), seasonIdx()); }
// 当前可引用的战队列表（赛季中用 L.teams，赛季外按当前时间线真实名单生成轻量对象）
function clubsNow() {
  if (L && L.teams) return L.teams;
  return curRows().map((r) => ({ n: r.n, sh: r.sh, pw: r.pw, c: (TEAM_META[r.sh] || {}).c || "#8a8f9e" }));
}
function nextRows() { return leagueRowsAt(curLeague(), seasonIdx() + 1); }
// IJL 某队某季的监管者 ID（名单标注；缺席/转位时由 buildSeason 兜底推定）
function ijlHuntIds(sh, idx, ids) {
  const tab = IJL_HUNT[sh];
  if (!tab) return [];
  const ks = Object.keys(tab).map(Number).filter((k) => k <= idx).sort((a, b) => a - b);
  if (!ks.length) return [];
  return tab[ks[ks.length - 1]].filter((x) => ids.indexOf(x) >= 0);
}
function myTeam() {
  let t = L.teams.find((x) => x.n === S.club);
  if (t) return t;
  // 旧档/改名：优先按稳定简称匹配，否则收编到末位队

}

  } else if (role === "decode") {

// 评估 KPI 完成度，返回奖励汇总
function evalKpi() {
  if (!S.kpi) return { money: 0, fans: 0, salary: 1, done: 0, total: 0 };
  const ss = S.ss;
  const seed = S._seed || standingsSorted().findIndex((t) => t.n === S.club) + 1;
  const isH = S.faction === "H";
  let money = 0, fans = 0, salary = 1, done = 0;
  S.kpi.forEach((g) => {
    let ok = false;
    if (g.id === "playoff") ok = seed <= 6;
    else if (g.id === "fourk") ok = ss.fourK >= g.target;
    else if (g.id === "kills") ok = (ss.kills || 0) >= g.target;
    else if (g.id === "fourout") ok = ss.fourOut >= g.target;
    else if (g.id === "kite") ok = ss.games > 0 && (ss.kiteT / ss.games) >= g.target;
    else if (g.id === "rescue") ok = ss.rescTry >= 10 && (ss.rescOk / ss.rescTry * 100) >= g.target;
    else if (g.id === "dec") ok = ss.dec >= g.target;
    g.done = ok;
    if (ok) { done++; money += g.reward.money; fans += g.reward.fans; salary *= g.reward.salary; }
  });
  return { money, fans, salary, done, total: S.kpi.length };
}

function kpiCard() {
  if (!S.kpi) S.kpi = genKpi(); // 旧存档兜底

    if (g.id === "playoff") cur = `当前第 ${S._seed || standingsSorted().findIndex((t) => t.n === S.club) + 1} 名`;
    else if (g.id === "fourk") cur = `${ss.fourK}/${g.target}`;
    else if (g.id === "kills") cur = `${ss.kills || 0}/${g.target}`;

    else if (g.id === "kite") cur = ss.games ? `${Math.round(ss.kiteT / ss.games)}s/${g.target}s` : `0/${g.target}s`;
    else if (g.id === "rescue") cur = ss.rescTry ? `${Math.round(ss.rescOk / ss.rescTry * 100)}%` : "0%";
    else if (g.id === "dec") cur = `${Math.round(ss.dec)}/${g.target}`;

  let ptsB = rB.exits * 2 + hunterPtsByKills(4 - rA.exits);

function quickSeries(tA, tB, bo) {

  let a = 0, b = 0, g = 0;
  while (a < need && b < need && g++ < bo + 2) {

    tA.gw += r.ptsA > r.ptsB ? 1 : 0; tA.gl += r.ptsA < r.ptsB ? 1 : 0;
    tB.gw += r.ptsB > r.ptsA ? 1 : 0; tB.gl += r.ptsB < r.ptsA ? 1 : 0;
    if (r.ptsA > r.ptsB) a++; else if (r.ptsB > r.ptsA) b++;

      pushEvent(`队内竞争：替补 <b>${strong.name}</b> 训练状态火热，挤掉 <b>${weak.name}</b> 进入首发。默契 -2。`, "info", "轮换");

  pushNews(`${S.club} 变阵：${S.name} 状态低迷被下放替补，${cand.name} 顶上首发。`, "与你相关");
}
function recallPlayer(msg) {
  const t = myTeam(); if (!t || !S.playerBenched) return;
  const meP = (t.bench || []).find((x) => x.isP) || playerAs(S.fav);
  if (S.faction === "H") {
    const cur = t.roster.h;
    t.roster.h = meP;
    t.bench = (t.bench || []).filter((x) => !x.isP);
    if (cur && !cur.isP) t.bench.push(cur);
  } else {
    const out = t.roster.s.filter((x) => !x.isP).sort((a, b) => playerPower(a) - playerPower(b))[0];
    t.roster.s = t.roster.s.filter((x) => x !== out).concat([meP]);
    t.bench = (t.bench || []).filter((x) => !x.isP);
    if (out) t.bench.push(out);
  }
  S.playerBenched = false;
  if (msg !== false) {
    pushEvent(`你重回首发阵容——教练组愿意再给你一次机会。`, "good", "轮换");
    if (!S.ach.comeback) getAch("comeback", "王者归来", "从替补重新打回首发");
  }
}
// 被下放的一周：AI 代打，玩家观战；赛后自动召回
function benchWatchWeek(opp) {
  const me = myTeam();
  const r = quickSeries(me, opp, 3);
  const win = r.a > r.b;
  if (win) { me.w++; S.record.w++; opp.l++; }
  else if (r.a < r.b) { me.l++; S.record.l++; opp.w++; }
  pushEvent(`你坐在替补席观战：${S.club} <b>${r.a} : ${r.b}</b> ${win ? "击败" : "不敌"} ${opp.n}。`, win ? "good" : "bad", "IVL");
  S.form = clamp(S.form + 4, 0, 100);
  S.fatigue = clamp(S.fatigue - 10, 0, 100);
  settleOtherWeekMatches();
  recallPlayer(false);
  pushEvent(`板凳坐穿一周——教练组决定让你重回首发。用表现证明自己吧。`, "info", "轮换");
  S.week++;
  if (S.week > SEASON_WEEKS) endRegularSeason();
  else { S.ap = maxAp(); S.step = "season"; }
  saveGame(); render();
}
function endRegularSeason() {
  if (S.playerBenched) recallPlayer(false); // 季后赛前强制召回
  const tab = standingsSorted();
  const seed = tab.findIndex((t) => t.n === S.club) + 1;
  S._seed = seed;
  if (seed <= 6) {
    S.step = "po";
    buildPlayoff(tab);
    if (!S.career.seasons.length && !S.ach.stardo) getAch("stardo", "出道即巅峰", "首个职业赛季便闯入季后赛");
    pushEvent(`常规赛收官，${S.club} 排名第 <b>${seed}</b>，挺进季后赛！`, "big", "常规赛");
  } else {
    pushEvent(`常规赛第 <b>${seed}</b> 名，无缘季后赛。看别人打完这个秋天。`, "bad", "常规赛");
    simPlayoffWithoutMe(tab);
    settleSeason(null, seed);
  }
  saveGame(); render();
}
function standingsSorted() {
  return L.teams.slice().sort((a, b) =>
    (b.w - a.w) || (b.gw - b.gl) - (a.gw - a.gl) || b.gw - a.gw);
}

/* ================= 季后赛 ================= */
function buildPlayoff(tab) {
  // 6 队：3v6 / 4v5 → 1,2 轮空进半决赛
  S.po = {
    rounds: [
      { n: "六进四（BO5）", ms: [{ a: tab[2], b: tab[5], res: null }, { a: tab[3], b: tab[4], res: null }] },
      { n: "半决赛（BO5）", ms: [{ a: tab[0], b: null, res: null }, { a: tab[1], b: null, res: null }] },
      { n: "总决赛（BO5）", ms: [{ a: null, b: null, res: null }] }
    ],
    ri: 0, champion: null
  };
}
function myPoMatch() {
  const r = S.po.rounds[S.po.ri];
  if (!r) return null;
  return r.ms.find((m) => m && (m.a && m.a.n === S.club || m.b && m.b.n === S.club)) || null;
}
function poRoundReady() {
  // 玩家若在场，是否已打完本轮
  const r = S.po.rounds[S.po.ri];
  return r.ms.every((m) => m.res);
}
function poSimOthers() {
  const r = S.po.rounds[S.po.ri];
  r.ms.forEach((m) => {
    if (m.res || !m.a || !m.b) return;
    if (m.a.n === S.club || m.b.n === S.club) return;
    const x = quickSeries(m.a, m.b, 5);
    m.res = x.a > x.b ? m.a : m.b;
    m.score = `${x.a}:${x.b}`;
  });
}
function poAdvance() {
  const po = S.po, r = po.rounds[po.ri];
  const wins = r.ms.map((m) => m.res);
  if (po.ri === 0) {
    po.rounds[1].ms[0].b = wins[0];
    po.rounds[1].ms[1].b = wins[1];
  } else if (po.ri === 1) {
    po.rounds[2].ms[0] = { a: wins[0], b: wins[1], res: null };
  } else if (po.ri === 2) {
    po.champion = wins[0];
    settleSeason(po.champion.n === S.club ? "champion" : null, S._seed);
    return;
  }
  po.ri++;
  saveGame(); render();
}
function poAfterSeries(win) {
  const r = S.po.rounds[S.po.ri];
  const m = r.ms.find((x) => x && (x.a && x.a.n === S.club || x.b && x.b.n === S.club));
  if (m) {
    m.res = win ? (m.a.n === S.club ? m.a : m.b) : (m.a.n === S.club ? m.b : m.a);
    m.score = win ? "胜" : "负";
  }
  S.step = "po";
  // 若本轮全结束则等玩家点“下一轮”
  saveGame();
}
function simPlayoffWithoutMe(tab) {
  // 纯 AI 季后赛
  const w1a2 = quickSeries(tab[2], tab[5], 5);
  const q1 = w1a2.a > w1a2.b ? tab[2] : tab[5];
  const w2 = quickSeries(tab[3], tab[4], 5);
  const q2 = w2.a > w2.b ? tab[3] : tab[4];
  const s1 = quickSeries(tab[0], q1, 5); const sf1 = s1.a > s1.b ? tab[0] : q1;
  const s2 = quickSeries(tab[1], q2, 5); const sf2 = s2.a > s2.b ? tab[1] : q2;
  const f = quickSeries(sf1, sf2, 5);
  S._poChamp = (f.a > f.b ? sf1 : sf2).n;
}

/* ================= 赛季结算 / 休赛期 ================= */
function settleSeason(result, seed) {
  const standing = seed || S._seed || standingsSorted().findIndex((t) => t.n === S.club) + 1;
  const champ = S.po ? S.po.champion.n : S._poChamp;
  let prize = 0;
  if (result === "champion") { prize = 500; S.career.titles.push(seasonTag(S.si) + " 总决赛冠军"); getAch("champ", "今夜登顶", "夺得 IVL 总决赛冠军"); sfx("win"); }
  else prize = standing <= 3 ? 120 : standing <= 6 ? 60 : 20;
  S.money += prize;
  S.career.bestStand = Math.min(S.career.bestStand, standing);
  S.career.fourK += S.ss.fourK; S.career.fourOut += S.ss.fourOut; S.career.mvp += S.ss.mvp;
  S.career.hs += S.ss.games;
  if (S.career.hs >= 100 && !S.ach.cent) getAch("cent", "百战老将", "职业生涯累计出战 100 个半场");
  if (result === "champion" && S.career.seasons.length >= 2 &&
    S.career.seasons[S.career.seasons.length - 2].result === "champion") getAch("dynasty", "王朝缔造", "卫冕 IVL 总决赛冠军");
  S.career.peak = Math.max(S.career.peak || 0, Math.round(S.rank));
  // 赛季 KPI 结算：影响奖金、粉丝与续约薪资
  const kpi = evalKpi();
  if (kpi.total > 0) {
    prize += kpi.money;
    addFans(kpi.fans);
    pushEvent(`赛季 KPI：完成 <b>${kpi.done}/${kpi.total}</b> 项目标${kpi.money > 0 ? `，额外奖金 <b>${kpi.money}</b> 万` : ""}${kpi.fans > 0 ? `，涨粉 <b>${kpi.fans.toLocaleString()}</b>` : ""}${kpi.done > 0 ? `，续约薪资 ×${kpi.salary.toFixed(2)}` : ""}。`, kpi.done >= 2 ? "good" : "info", "KPI");
  }
  S.career.seasons.push({
    tag: seasonTag(S.si), club: S.club, standing, result,
    w: S.record.w, l: S.record.l,
    kite: Math.round(S.ss.kiteT / Math.max(1, S.ss.games)),
    resc: S.ss.rescTry ? Math.round(S.ss.rescOk / S.ss.rescTry * 100) : null,
    fourK: S.ss.fourK, fourOut: S.ss.fourOut, mvp: S.ss.mvp
  });
  S.heat = 0;
  // 叙事类成就检查
  if (S.fans >= 1000000 && !S.ach.millionFan) getAch("millionFan", "百万粉达人", "社交媒体粉丝突破 100 万");
  if ((S.career.earned || 0) >= 10000 && !S.ach.billionaire) getAch("billionaire", "亿元先生", "生涯总薪资突破 1 亿");
  if ((S.career.earned || 0) >= 100 && !S.ach.fivehundred) getAch("fivehundred", "百万富翁", "生涯总薪资突破 100 万");
  if (S.chems >= 95 && !S.ach.teamChem) getAch("teamChem", "默契之王", "队伍默契达到 95 以上");
  if (S.career.mvp >= 10 && !S.ach.mvp10) getAch("mvp10", "十步杀一人", "累计拿到 10 次局内 MVP");
  if (S.career.mvp >= 30 && !S.ach.mvp30) getAch("mvp30", "大魔王", "累计拿到 30 次局内 MVP");
  if (result === "champion" && S.record.w + S.record.l > 0 && S.record.l === 0 && !S.ach.perfect) getAch("perfect", "完美赛季", "单赛季全胜夺冠");
  if (S.career.clubs.length >= 4 && !S.ach.journeyman) getAch("journeyman", "四海为家", "效力过 4 支及以上不同战队");
  if (S.career.seasons.length >= 6) {
    const lastClub = S.career.seasons[S.career.seasons.length - 1].club;
    if (S.career.seasons.slice(-6).every((x) => x.club === lastClub) && !S.ach.loyal) getAch("loyal", "一人一城", "在同一支战队效力 6 个赛季以上");
  }
  if (result === "champion" && S.playerBenched && !S.ach.cinderella) getAch("cinderella", "逆袭剧本", "从替补一路打上冠军");
  if (result === "champion" && S.wasStream && !S.ach.streamchamp) getAch("streamchamp", "双栖传奇", "主播身份转型后夺冠");
  S.step = "offseason";
  // 已履行一个赛季，剩余合同年 -1
  const remain = Math.max(0, (S.contract.years || 1) - 1);
  S.off = { week: 1, decided: false, offers: [], remain, buyout: buyoutOf(S.contract.salary, remain), recruitUsed: false };
  S.ap = AP_OFF;
  // 市场价值：段位 + MVP + 冠军 + 巅峰
  const myClubPw = (clubsNow().find((x) => x.n === S.club) || clubsNow()[0]).pw;
  const value = S.rank + S.ss.mvp * 3 + S.career.titles.length * 8 + (S.career.bestStand <= 3 ? 6 : 0);
  // 感兴趣的队：实力门槛随球员行情放宽，取 3-5 支
  // 休赛期谈判对象按【下赛季】真实参赛名单（含升换席位的新队）
  const nextClubs = leagueRowsAt(curLeague(), Math.min(seasonIdx() + 1, SEASON_LIST.length - 1))
    .map((r) => ({ n: r.n, sh: r.sh, pw: r.pw }));
  const nextMine = nextClubs.find((c) => c.sh === S.clubSh);
  let interested = nextClubs.filter((c) => c.sh !== S.clubSh)
    .filter((c) => c.pw + ri(-10, 10) + value * .4 > myClubPw - 18)
    .sort(() => R() - .5).slice(0, ri(3, 5));
  if (!nextMine && !interested.length) interested = [nextClubs.slice().sort((a, b) => a.pw - b.pw)[0]]; // 席位更替兜底
  S.off.clubAlive = !!nextMine;
  // 忠诚度影响报价诚意
  if (S.loyalty != null && S.loyalty >= 80) {
    interested = interested.slice(0, 2); // 忠诚高：市场兴趣收敛，母队报价更优
  }
  S.off.offers = interested.map((c) => {
    const salary = Math.max(8, Math.round(c.pw * 1.3 / 4 + value * .25) + ri(4, 16));
    const years = chance(.35) ? 2 : 1; // 少数队给长约
    const bonus = Math.round(salary * (years === 2 ? .5 : .3)) + ri(2, 8);
    return { club: c.n, sh: c.sh, pw: c.pw, salary, years, bonus, buyout: buyoutOf(salary, years - 1) };
  });
  // 经纪人来电：高薪弱队 vs 低薪争冠队 的两难
  if (S.off.offers.length >= 2) {
    const bySal = S.off.offers.slice().sort((a, b) => b.salary - a.salary);
    const byPw = S.off.offers.slice().sort((a, b) => b.pw - a.pw);
    const highPay = bySal[0], strongTeam = byPw[0];
    if (highPay.club !== strongTeam.club && highPay.salary - strongTeam.salary >= 6) {
      S.off.dilemma = { highPay: highPay.club, strong: strongTeam.club };
      pushEvent(`<b>经纪人来电</b>：「现在桌上有两份报价——<b>${highPay.club}</b> 给你 <b>${highPay.salary}</b> 万年薪，但他们战力一般，夺冠窗口小；<b>${strongTeam.club}</b> 只给 <b>${strongTeam.salary}</b> 万，但是争冠大热。钱还是奖杯？你想想。」`, "info", "经纪人");
    }
  }
  // 续约三档：1/2/3 年，年限越长忠诚年薪越高
  const base = Math.round((S.contract.salary + ri(-2, 6) + (S.career.titles.length ? 4 : 0)) * (kpi.salary || 1));
  S.off.renewOpt = [1, 2, 3].map((y) => ({ years: y, salary: Math.round(base * (1 + (y - 1) * .08)) }));
  S.off.renew = S.off.renewOpt[0].salary;
  pushEvent(`赛季结算：常规赛第 ${standing} 名${result === "champion" ? "，<b>总决赛冠军！</b>" : champ ? `，冠军是 ${champ}` : ""}。奖金 <b>${prize}</b> 万。`,
    result === "champion" ? "big" : "info", "结算");
  // 数据向新闻：引用玩家真实赛季数据
  const kiteAvg = S.ss.games ? Math.round(S.ss.kiteT / S.ss.games) : 0;
  const statNews = S.faction === "H"
    ? `${S.name} 本赛季打出 <b>${S.ss.fourK}</b> 次四抓，局内 MVP <b>${S.ss.mvp}</b> 次。`
    : `${S.name} 本赛季场均牵制 <b>${kiteAvg}s</b>，救援成功率 <b>${S.ss.rescTry ? Math.round(S.ss.rescOk / S.ss.rescTry * 100) : 0}%</b>，局内 MVP <b>${S.ss.mvp}</b> 次。`;
  pushNews(statNews, "数据");
  // 家庭承诺兑现：若上赛季答应家人"赛季后考虑退役"却没退，触发家庭矛盾
  if (S._familyPromise) {
    S._familyPromise = false;
    S.attrs["心态"] = q1(Math.max(S.attrs["心态"] - 3, 20));
    S.loyalty = clamp((S.loyalty || 50) - 5, 0, 100);
    pushEvent(`父亲再次来电：「你说赛季后好好想想的。」你无言以对——心态 -3，与家人关系降至冰点。`, "bad", "人生");
  }
  S.po = null;
  saveGame(); render();
}
function offNextWeek() {

// kind: 'stay'(续约,arg=年限) | 'move'(转会,arg=俱乐部)
function decideFuture(kind, arg) {
  if (kind === "stay" && S.off.clubAlive === false) { toast("你的战队下赛季不在联赛名单中，无法续约", "bad"); return; }
  S.off.decided = true;
  if (kind === "stay") {
    const y = +arg || 1;
    const opt = S.off.renewOpt.find((o) => o.years === y) || S.off.renewOpt[0];
    S.off.nextClub = S.club; S.off.nextSh = S.clubSh;
    S.off.nextSalary = opt.salary; S.off.nextYears = y; S.off.nextBuyout = buyoutOf(opt.salary, y - 1); S.off.nextBonus = 0;
    S.loyalty = clamp((S.loyalty || 50) + 12, 0, 100); // 续约忠诚上升
    pushEvent(`你选择和俱乐部续约 <b>${y}</b> 年，年薪 <b>${opt.salary}</b> 万。`, "info", "合同");
  } else {
    const o = S.off.offers.find((x) => x.club === arg);
    if (!o) return;
    o.used = true;
    S.off.nextClub = o.club; S.off.nextSh = o.sh;
    S.off.nextSalary = o.salary; S.off.nextYears = o.years; S.off.nextBuyout = o.buyout; S.off.nextBonus = o.bonus;
    if (!S.career.clubs.includes(o.club)) S.career.clubs.push(o.club);
    if (!S.ach.transfer) getAch("transfer", "转会风波", "完成一次职业转会");
    S.loyalty = 30; // 转会后忠诚度重置
    S.raiseAsked = 0; // 新队重置涨薪次数
    if (S.off.buyout > 0) pushEvent(`你决定提前转会——向母队支付违约金 <b>${S.off.buyout}</b> 万，下赛季披上 <b>${o.club}</b> 的队服（${o.years} 年合同）。`, "big", "转会");
    else pushEvent(`合同年自由身，你决定转会——下赛季披上 <b>${o.club}</b> 的队服（${o.years} 年合同，签字费 ${o.bonus} 万）。`, "big", "转会");
  }
  saveGame(); render();
}
function finishOffseason() {
  if (!S.off.decided) { toast("先决定续约还是转会", "bad"); return; }
  S.age++;
  // 年龄曲线：22-25 缓慢成长，25-28 维持（意识/心态微涨），28+ 反应类下滑
  dimsOf(S).forEach((d) => {
    if (S.age <= 25) {
      // 成长期：反应类微涨
      if (d === "追击" || d === "牵制" || d === "救人") S.attrs[d] = q1(Math.min(S.attrs[d] + .3, 98));
    } else if (S.age >= 28) {
      // 衰退期：反应类缓慢下滑，28岁起每年约0.5，30岁后加速
      if (d === "追击" || d === "牵制" || d === "救人") {
        const drop = S.age >= 30 ? (S.age - 29) * .6 : .5;
        S.attrs[d] = q1(Math.max(20, S.attrs[d] - drop));
      }
    }
    // 意识/心态/配合终身成长（但有上限）
    if (d === "心态" || d === "意识" || d === "配合") S.attrs[d] = q1(Math.min(S.attrs[d] + .4, 98));
  });
  if (S.age >= RETIRE_AGE) { retireNow(); return; }
  // 时间线终点：2026 秋季赛之后无更多赛季，直接进入退役结算
  if (seasonIdx() + 1 >= SEASON_LIST.length) {
    pushEvent("2026 秋季赛大幕落下——你在夜航中的航程，也到了靠岸的时候。", "big", "终章");
    retireNow(); return;
  }
  // 违约金支出（提前离队）
  if (S.off.nextClub !== S.club && S.off.buyout > 0) {
    S.money -= S.off.buyout;
    S.career.earned = Math.max(0, (S.career.earned || 0) - S.off.buyout);
  }
  S.si++;
  S.club = S.off.nextClub; S.clubSh = S.off.nextSh;
  S.contract = { salary: S.off.nextSalary, years: S.off.nextYears, tier: S.contract.tier, buyout: S.off.nextBuyout };
  // 年薪 + 签字费
  earnMoney(S.off.nextSalary);
  if (S.off.nextBonus) earnMoney(S.off.nextBonus);
  S.fatigue = 8; S.inj = null;
  S.off = null;
  buildSeason();
  S.step = "season";
  saveGame(); render();
}
// 主播退役：以主播身份走到底，不转职业
function streamRetire() {
  const st = S.stream;
  const score = (st.earned || 0) * .2 + (st.lv || 1) * 60
    + Math.log10(Math.max(100, S.fans)) * 30 + (S.career.peak || 0) * .3 + (st.cycle || 1) * 15;

function coachPlayerInteract(k) {

// 指定选手特训：提升其分工权重最高的两项属性
function coachTrainPlayer(name) {
  const co = S.coach;
  const t = myTeam();
  if (!t || !co || co.ap < 1) return;
  const p = [t.roster.h].concat(t.roster.s).find((x) => x.name === name);
  if (!p) return;
  co.ap--;
  const dims = p.role ? DIMS_S : DIMS_H;
  // 分工权重排序：求生按 ROLES.w，监管默认追击>守椅>控场
  let ordered = dims.slice();
  if (p.role) {
    const rw = (ROLES.find((r) => r.k === p.role) || {}).w || {};
    ordered.sort((a, b) => (rw[b] || 1) - (rw[a] || 1));
  }
  const moraleMul = (p.morale || 60) >= 70 ? 1.5 : (p.morale || 60) >= 40 ? 1 : .5; // 士气影响训练效果
  const gains = [];
  [ordered[0], ordered[1]].forEach((d, i) => {
    const base = i === 0 ? 2 : 1;
    const g = Math.max(1, Math.round(base * moraleMul));
    p.attrs[d] = q1(clamp(p.attrs[d] + g, 20, 98));
    gains.push(`${d} +${g}`);
  });
  p.mastery = q1(clamp((p.mastery || 60) + 1, 40, 98));
  p.form = clamp((p.form || 60) - 5, 20, 100);
  pushEvent(`特训 <b>${esc(p.name)}</b>：${gains.join("，")}，熟练度 +1，状态 -5${moraleMul > 1 ? "（士气高昂，效果加成）" : moraleMul < 1 ? "（士气低落，事倍功半）" : ""}。`, "good", "执教");
  afterAct();
}

    S.attrs[d] = q1(clamp((S.attrs[d] || 50) + it.subAttr, 20, 98));
  }

  if (it.fatigue) S.fatigue = clamp(S.fatigue + it.fatigue, 0, 100);

// 角色熟练度颜色段位
function masteryColor(v) {
  if (v >= 90) return "var(--gold-hi)";
  if (v >= 75) return "var(--green)";
  if (v >= 60) return "var(--blue)";
  if (v >= 45) return "var(--gold)";
  return "var(--muted)";
}
function masteryTier(v) {
  if (v >= 95) return "殿堂级";
  if (v >= 85) return "招牌";
  if (v >= 70) return "熟练";
  if (v >= 55) return "上手";
  return "生疏";
}
// 角色池：展示玩家所有可用角色及其熟练度
function viewCharPool() {
  const isH = S.faction === "H";
  const pool = S.pool || {};
  // 主播路线解锁全部角色且显示双阵营；职业路线按赛季解锁仅本阵营
  const isStream = S.step === "stream";
  const allH = CHARS_H.filter((c) => CHAR_MODS[c]);
  const allS = CHARS_S.filter((c) => CHAR_MODS[c]);
  const hChars = isStream ? allH : availHChars(seasonIdx());
  const sChars = isStream ? allS : availSChars(seasonIdx());
  const chars = isStream ? allH.concat(allS) : (isH ? hChars : sChars);
  const played = chars.filter((c) => pool[c] != null);
  const mastered = chars.filter((c) => playerCharMastery(c) >= 70);
  const avgM = chars.length ? Math.round(chars.reduce((a, c) => a + playerCharMastery(c), 0) / chars.length) : 0;
  const bestC = chars.slice().sort((a, b) => playerCharMastery(b) - playerCharMastery(a))[0];
  const summary = `<div class="card"><h2>角色池总览<em>${isStream ? "双阵营" : isH ? "监管者" : "求生者"}</em></h2>
    <div class="kv">
      <span>可用角色 <b>${chars.length}</b></span>
      <span>已练过 <b>${played.length}</b></span>
      <span>熟练以上 <b>${mastered.length}</b></span>
      <span>平均熟练度 <b>${avgM}</b></span>
      <span>本命 <b style="color:var(--gold-hi)">${esc(S.fav || "—")} ${playerCharMastery(S.fav)}</b></span>
      <span>最高熟练度 <b>${bestC ? esc(bestC) + " " + playerCharMastery(bestC) : "—"}</b></span>
    </div>
    <p class="note" style="margin-top:6px">${S.step === "stream" ? "通过「练角色」行动提升熟练度，本命上限 95，非本命上限 90。" : "每使用一个角色完成半场，熟练度 +1.2（上限 95）。偏好角色初始熟练度更高。"}</p>
  </div>`;
  // 分组：主播显示双阵营（监管者 + 四分工）；职业仅本阵营
  let groups;
  if (isStream) {
    const roleNames = { kite: "牵制位", rescue: "救援位", decode: "破译位", support: "辅助位" };
    groups = [{ n: "监管者", list: hChars }].concat(
      ["kite", "rescue", "decode", "support"].map((k) => ({
        n: roleNames[k], list: sChars.filter((c) => charRoleOf(c) === k)
      })).filter((g) => g.list.length)
    );
  } else if (isH) {
    groups = [{ n: "监管者", list: chars }];
  } else {
    const roleNames = { kite: "牵制位", rescue: "救援位", decode: "破译位", support: "辅助位" };
    groups = ["kite", "rescue", "decode", "support"].map((k) => ({
      n: roleNames[k], list: chars.filter((c) => charRoleOf(c) === k)
    })).filter((g) => g.list.length);
  }
  const cardColor = (v) => v >= 85 ? "border-color:var(--gold-hi)" : v >= 70 ? "border-color:var(--green)" : v >= 55 ? "border-color:var(--blue)" : "";
  const groupsHtml = groups.map((g) => `<div class="card">
    <h2>${g.n}<em>${g.list.length} 个角色</em></h2>
    <div class="grid g2">${g.list.map((c) => {
      const v = playerCharMastery(c);
      const isFav = c === S.fav;
      const isPlayed = pool[c] != null;
      const col = masteryColor(v);
      return `<div class="rr" style="${cardColor(v)}">
        <div style="flex:1;min-width:0">
          <div class="kv" style="margin:2px 0">
            <span style="font-weight:700;color:var(--ink)">${esc(c)}${isFav ? ' <span class="tag y">本命</span>' : ""}${!isPlayed && !isFav ? ' <span class="tag" style="opacity:.6">未使用</span>' : ""}</span>
            <span style="color:${col};font-weight:700">${v} <span style="font-size:10px;font-weight:400;opacity:.8">${masteryTier(v)}</span></span>
          </div>
          <div class="bar" style="margin:4px 0"><i style="width:${clamp(v, 0, 100)}%;background:${col}"></i></div>
          <div class="note" style="font-size:11px;line-height:1.4">${charModDesc(c)}</div>
        </div>
      </div>`;
    }).join("")}</div>
  </div>`).join("");
  return summary + groupsHtml;
}
function feedHtml() {
  const all = S.events || [];
  const filter = S.feedFilter || "all";
  const filters = [
    { k: "all", n: "全部" },
    { k: "比赛", n: "比赛" },
    { k: "训练", n: "训练" },
    { k: "恋情", n: "恋情" },
    { k: "宿敌", n: "宿敌" },
    { k: "important", n: "重要" }
  ];
  const bar = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
    ${filters.map((f) => `<button class="chip" style="${filter === f.k ? "background:var(--gold);color:#1a1c26;border-color:var(--gold)" : ""}" data-act="feedfilter" data-arg="${f.k}">${f.n}</button>`).join("")}
  </div>`;
  let ev = all;
  if (filter === "important") ev = all.filter((e) => e.tone === "big" || e.tone === "bad" || e.tone === "good");
  else if (filter !== "all") ev = all.filter((e) => e.tag === filter);
  ev = ev.slice(0, 30);
  if (!ev.length) return bar + `<p class="note">该分类下暂无事件。</p>`;
  return bar + `<div class="feed">${ev.map((e) =>
    `<div class="ev ${e.tone || ""}"><span class="et">${e.tag || ""}</span>${e.text}</div>`).join("")}</div>`;
}
function tabsHtml(list) {
  return `<div class="tabs">${list.map((t) =>
    `<button class="${S.tab === t.k ? "on" : ""}" data-tab="${t.k}">${t.n}</button>`).join("")}</div>`;
}

  return `<div class="create-hero" style="padding-top:8px"></div>${inner}`;
}
function bindCreate() {
  const c = S.create;
  document.querySelectorAll("[data-fac]").forEach((b) => b.onclick = () => {
    c.faction = b.dataset.fac; c.role = ""; c.entrySeason = null; c.char = ""; c.pts = null; c.ok1 = false; render();
  });
  document.querySelectorAll("[data-role]").forEach((b) => b.onclick = () => { c.role = b.dataset.role; c.entrySeason = null; c.char = ""; render(); });
  document.querySelectorAll("[data-season]").forEach((b) => b.onclick = () => {
    const i = +b.dataset.season;
    c.entrySeason = i;
    // 已选角色若在该赛季未上线则清空
    if (c.char) {
      const ok = c.faction === "H" ? availHChars(i)
        : c.faction === "ST" ? CHARS_H.concat(CHARS_S)
        : charsOfRole(c.role, i);
      if (ok.indexOf(c.char) < 0) c.char = "";
    }
    render();
  });
  document.querySelectorAll("[data-char]").forEach((b) => b.onclick = () => { c.char = b.dataset.char; render(); });
  const _crBirth = document.getElementById("crBirth");
  if (_crBirth) _crBirth.onchange = () => { c.birthYear = +_crBirth.value; render(); };
  document.querySelectorAll("[data-gen]").forEach((b) => b.onclick = () => { c.gender = b.dataset.gen; render(); });
  document.querySelectorAll("[data-av]").forEach((b) => b.onclick = () => {
    if (b.dataset.av === "rand") {
      c.avatar = { skin: ri(0, AV.skin.length - 1), hair: ri(0, AV.hair.length - 1), hairC: ri(0, AV.hairC.length - 1), eyes: ri(0, AV.eyes.length - 1), mouth: ri(0, AV.mouth.length - 1), acc: ri(0, AV.acc.length - 1), outfit: ri(0, AV.outfit.length - 1), face: ri(0, AV.face.length - 1), makeup: ri(0, AV.makeup.length - 1), hl: null };
    } else {
      c.avatar[b.dataset.av] = +b.dataset.i;
    }
    render();
  });
  document.querySelectorAll("[data-pers]").forEach((b) => b.onclick = () => { c.persona = b.dataset.pers; render(); });
  document.querySelectorAll("[data-style]").forEach((b) => b.onclick = () => { c.style = b.dataset.style; render(); });
  document.querySelectorAll("[data-pt]").forEach((b) => b.onclick = () => {
    const d = b.dataset.pt, dir = +b.dataset.dir;
    const dims = c.faction === "H" ? DIMS_H : DIMS_S;
    const left = 15 - dims.reduce((x, k) => x + Math.max(0, c.pts[k] - 40), 0);
    if (dir > 0 && (left <= 0 || c.pts[d] >= 70)) return;
    if (dir < 0 && c.pts[d] <= 30) return;
    c.pts[d] += dir; render();
  });
  const pr = document.querySelector("[data-ptreset]");
  if (pr) pr.onclick = () => { c.pts = null; render(); };
  document.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => {
    const st = +b.dataset.back;
    if (st === 1) { c.faction = ""; c.role = ""; c.entrySeason = null; c.char = ""; c.pts = null; c.ok1 = false; }
    else if (st === 2) {
      // 赛季步返回：求生者回分工，其他回道路
      if (c.faction === "S") { c.role = ""; c.entrySeason = null; c.char = ""; c.pts = null; c.ok1 = false; }
      else { c.faction = ""; c.entrySeason = null; c.char = ""; c.pts = null; c.ok1 = false; }
    }
    else if (st === 3) { c.entrySeason = null; c.char = ""; }
    else if (st === 4) { c.char = ""; c.ok1 = false; }
    else if (st === 5) { c.ok1 = false; }
    render();
  });
  const inp = $("crName");
  if (inp) { inp.oninput = () => { c.name = inp.value; }; }
  const avN = $("crAvNext");
  if (avN) avN.onclick = () => {
    if (!c.gender) { toast("先选择性别", "bad"); return; }
    c.ok1 = true; render();
  };
  const go = $("crGo");
  if (go) go.onclick = () => {
    if (!c.persona) { toast("选择一个性格再出发", "bad"); return; }
    if (inp) c.name = inp.value;
    startCareer();
  };
}

function playHalf(strat, tactics) {
  const s = S.series;
  if (!s || s.phase !== "pre") return;
  if (s.halves.length >= 2) return;
  const which = s.halves.length === 0 ? "A" : "B";
  const interactive = (which === "A" && S.faction === "S") || (which === "B" && S.faction === "H");
  if (interactive) {
    const pk = ensureHalfReady(which);
    if (!strat) {
      if (!pk.player) { S.pop = { k: "charpick", which }; saveGame(); render(); return; }
      S.pop = { k: "strat", which }; saveGame(); render(); return;
    }
    if (!tactics) { _tacStep = 0; _pendingTactics = null; S.pop = { k: "tactics", which, strat }; saveGame(); render(); return; }
  }
  runHalf(which, strat || "normal", tactics);
  S.pop = { k: "halflog", which };
  saveGame(); render();
}
function pickChar(c, which) {
  const s = S.series;
  if (!s) return;
  const pk = ensureHalfReady(which);
  // 校验：时间线已解锁 + 未被 ban；系列赛已选角色仅在仍有其他可选时禁用
  const idx = seasonIdx();
  if (!charReleased(c, idx)) return;
  const isH = S.faction === "H";
  const list = isH ? availHChars(idx) : charsOfRole(S.role, idx);
  const used = isH ? s.usedOur.h : s.usedOur.s;
  const banned = isH ? (pk.banH || []) : (pk.banS || []);
  const hasFree = list.some((x) => used.indexOf(x) < 0 && banned.indexOf(x) < 0);
  if (banned.indexOf(c) >= 0 || (used.indexOf(c) >= 0 && hasFree)) return;
  pk.player = c;
  S.pop = { k: "strat", which };
  saveGame(); render();
}

// 代言：按粉丝解锁，有冷却(周)和负面风险
// 商务赚钱系统：代言 + 线下活动，统一按粉丝数解锁、有冷却、疲劳门槛与翻车风险
function bizCdTick() {
  const cd = (S.biz = S.biz || {}).cd || (S.biz.cd = {});
  Object.keys(cd).forEach((k) => { if (cd[k] > 0) cd[k]--; });
}
function bizCdOf(k) { return ((S.biz && S.biz.cd && S.biz.cd[k]) || 0); }
function takeBiz(e, kind) {
  if (!S.biz) S.biz = { cd: {}, done: 0 };
  if (S.fans < e.need) { toast("粉丝数不够", "bad"); return; }
  if (S.fatigue > 85) { toast("太疲劳了，先休息", "bad"); return; }
  if (bizCdOf(e.k) > 0) { toast("该活动还在冷却中", ""); return; }
  bizCdTick();
  S.biz.cd[e.k] = e.cd;
  S.biz.done = (S.biz.done || 0) + 1;
  if (kind === "offline") S.biz.offlineN = (S.biz.offlineN || 0) + 1;
  S.fatigue = clamp(S.fatigue + e.fat, 0, 100);
  const pay = ri(e.pay[0], e.pay[1]);
  const fans = ri(e.fans[0], e.fans[1]);
  earnMoney(pay);
  const tag = kind === "offline" ? "线下活动" : "代言";
  // 负面风险：翻车掉粉掉热度
  if (chance(e.risk)) {
    const lose = Math.round(fans * (.3 + R() * .5));
    S.fans = Math.max(0, S.fans - lose);
    S.heat = Math.max(0, (S.heat || 0) - 5);
    pushEvent(`<b>${e.n}</b> 现场翻车——被骂上热搜，掉粉 <b>${lose}</b>，口碑下滑。`, "bad", tag);
    sfx("danger");
  } else {
    S.fans += fans;
    S.heat = (S.heat || 0) + 3;
    pushEvent(`接下 <b>${e.n}</b>，到手 <b>${pay}</b> 万，涨粉 <b>${fans}</b>。`, "good", tag);
    sfx("cash");
  }
  checkBizAch();
  saveGame(); render();
}
function takeEndorsement(k) { const e = ENDORSEMENTS.find((x) => x.k === k); if (e) takeBiz(e, "endorse"); }
function takeOffline(k) { const e = OFFLINE_EVENTS.find((x) => x.k === k); if (e) takeBiz(e, "offline"); }
function bizRows(list, act) {
  return list.map((e) => {
    const locked = S.fans < e.need;
    const cooling = bizCdOf(e.k) > 0;
    const tired = S.fatigue > 85;
    const dis = locked || cooling || tired;
    const tag = locked ? `需 ${e.need.toLocaleString()} 粉`
      : cooling ? `冷却 ${bizCdOf(e.k)} 次`
      : tired ? "疲劳过高" : `${e.pay[0]}-${e.pay[1]} 万`;
    return `<div class="rr">
      <div class="kv" style="margin:2px 0">
        <span>${e.icon} <b>${esc(e.n)}</b></span>
        <span class="chip">${tag}</span>
      </div>
      <div class="note" style="font-size:12px;margin:2px 0">${esc(e.d)}</div>
      <div class="row" style="margin-top:4px">
        ${dis ? "" : `<button class="btn primary sm" data-act="${act}" data-arg="${e.k}">接单</button>`}
        <span class="note" style="font-size:11px">报酬 ${e.pay[0]}-${e.pay[1]}万 · 涨粉 ${e.fans[0]}-${e.fans[1]} · 疲劳+${e.fat}</span>
      </div>
    </div>`;
  }).join("");
}

function doCheat(k) {
  const freshSS = () => ({ kiteT: 0, rescOk: 0, rescTry: 0, dec: 0, exits: 0, kills: 0, games: 0, fourK: 0, fourOut: 0, mvp: 0 });
  if (k === "attrs") {
    dimsOf(S).forEach((d) => { S.attrs[d] = 95; });
  } else if (k === "rank") {
    S.rank = 95;
  } else if (k === "heal") {
    S.fatigue = 0; S.inj = null; S.form = 100; S.chems = 100;
  } else if (k === "ap") {
    if (S.step === "pre" || S.step === "offer") S.pre.ap = AP_PRE;
    else if (S.step === "stream") S.ap = AP_ST;
    else S.ap = AP_SEA;
  } else if (k === "money") {
    S.money += 500;
  } else if (k === "fans") {
    S.fans += 100000;
  } else if (k === "favmax") {
    if (!S.pool) S.pool = {};
    let list;
    if (S.step === "stream") {
      list = CHARS_H.concat(CHARS_S).filter((c) => CHAR_MODS[c]);
    } else {
      const idx = seasonIdx();
      list = S.faction === "H" ? availHChars(idx) : availSChars(idx);
    }
    list.forEach((c) => { S.pool[c] = 95; });
    S.favM = 95;
  } else if (k === "winweek") {
    if (!L || !S.club) { toast("先签约进入职业赛场", "bad"); return; }
    S.series = null; S.po = null;
    S.record.w++; myTeam().w++;
    addFans(5000); S.money += 5; S.heat = clamp(S.heat + 10, 0, 100);
    settleOtherWeekMatches();
    S.week++;
    if (S.week > SEASON_WEEKS) endRegularSeason();
    else { S.ap = AP_SEA; S.step = "season"; S.tab = "act"; }
    pushEvent(`【作弊】本周速胜，直接推进到第 ${S.week} 周。`, "big", "作弊");
  } else if (k === "tooffer") {
    if (S.step !== "pre") { toast("只在青训期可用", "bad"); return; }
    S.pre.week = PRE_WEEKS;
    openWindow();
  } else if (k === "sign") {
    S.pop = { k: "cheatTeam" }; render(); toast("选择一支战队", "info"); return;
  } else if (k === "topo") {
    if (!L || !S.club) { toast("先签约进入职业赛场", "bad"); return; }
    S.series = null;
    myTeam().w = Math.max(...L.teams.map((t) => t.w)) + 2;
    endRegularSeason();
  } else if (k === "tooff") {
    if (!L || !S.club) { toast("先签约进入职业赛场", "bad"); return; }
    S.series = null; S.po = null;
    settleSeason(null);
  } else if (k === "nextsea") {
    if (S.step !== "offseason" || !S.off) { toast("只在休赛期可用", "bad"); return; }
    S.off.decided = true; S.off.nextClub = S.club; S.off.nextSh = S.clubSh; S.off.nextSalary = S.contract.salary;
    finishOffseason();
  } else if (k === "stmax") {
    if (S.step !== "stream" || !S.stream) { toast("只在主播线可用", "bad"); return; }
    S.stream.lv = 5; S.stream.xp = 3000; addFans(50000);
  } else if (k === "stnext") {
    if (S.step !== "stream" || !S.stream) { toast("只在主播线可用", "bad"); return; }
    streamNextWeek(); return;
  } else if (k === "stgear") {
    if (S.step !== "stream" || !S.stream) { toast("只在主播线可用", "bad"); return; }
    S.stream.gear = 3;
  } else if (k === "stconn") {
    if (S.step !== "stream" || !S.stream) { toast("只在主播线可用", "bad"); return; }
    S.stream.conn = (S.stream.conn || 0) + 5;
  } else if (k === "topro") {
    if (S.step !== "stream" || !S.stream) { toast("只在主播线可用", "bad"); return; }
    S.rank = 95; if (S.fans < 15000) addFans(15000 - S.fans);

    if (S.step !== "end" || S.after) { toast("只在退役页可用", "bad"); return; }
    toCoach(); toast("作弊生效", "good"); return;
  } else if (k === "retire") {
    retireNow();
  } else return;
  S.pop = k === "retire" ? null : { k: "cheat" };
  saveGame(); render();
  toast("作弊生效", "good");

// 赛后数据复盘面板：五维对比 / 贡献分解 / 状态曲线
function reportModal() {
  const s = S.series;
  const h = s.halves[s.halves.length - 1];
  if (!h) return "";
  const opp = L.teams.find((t) => t.n === s.opp) || L.teams.find((t) => t.sh === s.oppSh);
  // 五维对比：玩家 vs 对方对位（按玩家阵营+半场判断是否需要维度映射）
  // 半场 A：对方是监管者；半场 B：对方是求生者
  // 玩家阵营与对方阵营同侧 → 直接同名对比；异侧 → 维度映射
  const dims = dimsOf(S);
  const myAttrs = S.attrs || {};
  const S2H = { "牵制": "追击", "救人": "守椅", "破译": "控场", "配合": "意识", "心态": "心态" };
  const H2S = { "追击": "牵制", "守椅": "救人", "控场": "破译", "意识": "配合", "心态": "心态" };
  let oppAttrs = {};
  if (opp) {
    const oppIsHunter = h.which === "A"; // 半场 A 对方是监管者
    const playerIsHunter = S.faction === "H";
    if (oppIsHunter) {
      const hAttrs = opp.roster.h.attrs || {};
      if (playerIsHunter) {
        // 同侧（监管 vs 监管）：直接同名对比
        dims.forEach((d) => { oppAttrs[d] = hAttrs[d] || 0; });
      } else {
        // 异侧（求生 vs 监管）：把监管维度映射到玩家的求生维度名
        dims.forEach((d) => { oppAttrs[d] = hAttrs[S2H[d]] || 0; });
      }
    } else {
      // 对方是求生者（4 人平均）
      const survAvg = opp.roster.s.reduce((a, p) => {
        dims.forEach((d) => {
          const sd = playerIsHunter ? H2S[d] : d; // 异侧才映射
          a[d] = (a[d] || 0) + (p.attrs[sd] || 0);
        });
        return a;
      }, {});
      dims.forEach((d) => oppAttrs[d] = Math.round((survAvg[d] || 0) / 4));
    }
  }
  const dimChart = dims.map((d) => {
    const mv = myAttrs[d] || 0, ov = oppAttrs[d] || 0, max = 100;
    return `<div style="margin-bottom:6px">
      <div class="kv" style="justify-content:space-between;font-size:12px"><span>${d}</span><span><b style="color:var(--blue)">${mv.toFixed(0)}</b> vs <b style="color:var(--red-hi)">${ov.toFixed(0)}</b></span></div>
      <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:#1a1f2e">
        <div style="width:${(mv/max*50)}%;background:var(--blue)"></div>
        <div style="flex:1"></div>
        <div style="width:${(ov/max*50)}%;background:var(--red-hi)"></div>
      </div>
    </div>`;
  }).join("");
  // 贡献分解条（求生者半场）
  let contribHtml = "";
  if (h.which === "A" && h.perP) {
    const maxKite = Math.max(1, ...h.perP.map((p) => p.kiteT));
    const maxDec = Math.max(1, ...h.perP.map((p) => p.dec));
    contribHtml = h.perP.map((p) => `<div class="rr" style="margin-bottom:8px">
      <div style="flex:1;min-width:80px"><b>${esc(p.name)}</b>${p.isP ? ' <span class="tag y">你</span>' : ""}</div>
      <div style="flex:2">
        <div class="kv" style="font-size:11px;margin-bottom:2px"><span>牵制 ${Math.round(p.kiteT)}s</span><span>救援 ${p.rescOk}/${p.rescTry}</span><span>破译 ${Math.round(p.dec)}</span><span>${p.exited ? "✅出门" : "❌"}</span></div>
        <div style="height:6px;background:#1a1f2e;border-radius:3px;overflow:hidden">
          <div style="width:${p.kiteT/maxKite*100}%;height:100%;background:linear-gradient(90deg,var(--blue),#7aa3d8)"></div>
        </div>
        <div style="height:6px;background:#1a1f2e;border-radius:3px;overflow:hidden;margin-top:2px">
          <div style="width:${p.dec/maxDec*100}%;height:100%;background:linear-gradient(90deg,var(--green),#8fca9a)"></div>
        </div>
      </div>
    </div>`).join("");
  } else if (h.which === "B" && h.hunterStat) {
    const hs = h.hunterStat;
    contribHtml = `<div class="rr"><div style="flex:1"><b>${esc(hs.name)}</b>${hs.isP ? ' <span class="tag y">你</span>' : ""}</div>
      <div style="flex:2"><div class="kv" style="font-size:11px"><span>淘汰 ${hs.kills}</span><span>首追 ${Math.round(hs.kiteT)}s</span></div></div></div>`;
  }
  // 近 6 场状态曲线
  const hist = S.perfHist || [];
  const sparkline = hist.length >= 2 ? (() => {
    const w = 180, hgt = 40, max = 100;
    const pts = hist.map((v, i) => `${(i / (hist.length - 1)) * w},${hgt - (v / max) * hgt}`).join(" ");
    return `<svg width="${w}" height="${hgt}" style="display:block;margin:6px auto">
      <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"/>
      ${hist.map((v, i) => `<circle cx="${(i / (hist.length - 1)) * w}" cy="${hgt - (v / max) * hgt}" r="3" fill="var(--gold-hi)"/>`).join("")}
    </svg><p class="note" style="text-align:center;font-size:11px">近 ${hist.length} 场评分曲线（最近在右）</p>`;
  })() : '<p class="note">暂无多场数据。</p>';
  return `<div class="mask"><div class="modal">
    <div class="eyebrow" style="color:var(--gold)">POST-MATCH REPORT</div><h2>赛后数据复盘</h2>
    <p class="note" style="text-align:center">${h.which === "A" ? "上半场" : "下半场"} · ${h.exits} 人出门 · 评分 ${h.score ? h.score.grade : "—"}</p>
    <div class="card" style="margin:8px 0;padding:10px"><h3 style="margin-bottom:6px">五维对比 <span style="font-size:11px;color:var(--blue)">蓝=你</span> <span style="font-size:11px;color:var(--red-hi)">红=对手</span></h3>${dimChart}</div>
    <div class="card" style="margin:8px 0;padding:10px"><h3 style="margin-bottom:6px">本场贡献分解</h3>${contribHtml || '<p class="note">无数据。</p>'}</div>
    <div class="card" style="margin:8px 0;padding:10px"><h3 style="margin-bottom:6px">状态曲线</h3>${sparkline}</div>
    <div style="text-align:center;margin-top:10px"><button class="btn gold sm" data-act="closepop">关闭</button></div>
  </div></div>`;
}
